name: Testes DevLab
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: python3 offline/build_standalone.py
      - run: node --check src/auth-client.js && node --check offline/source/auth-ui.js
      - run: node --test tests/auth-client.mjs
      - run: node tests/smoke.mjs
      - run: node tests/learning.mjs
      - run: node tests/study-tools.mjs
      - run: node tests/missions.mjs
      - run: node tests/lesson-assessment.mjs
      - run: node tests/lesson-contracts.mjs
      - run: node tests/preview-guard.mjs
      - run: node --test tests/workspace.mjs
      - run: node --test tests/frontend.mjs
      - run: node --test tests/backend.mjs
      - run: node --test tests/career.mjs
      - run: node --test tests/learning-navigation.mjs
      - run: node tests/dark-theme.mjs
      - run: node --test tests/pathways.mjs
      - run: node tests/editor-theme.mjs
      - run: node --test tests/php.mjs
      - run: node --test tests/curriculum-mastery.mjs
      - run: node --test tests/micro-lessons.mjs
      - run: node scripts/build-static.mjs
