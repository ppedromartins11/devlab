/* DevLab / Workspace v3
   Editorial learning UI. Intentionally restrained: no ornamental gradients,
   glows, oversized metric cards or decorative 'AI dashboard' components. */
:root {
  color-scheme: light;
  --canvas: #f7f7f5;
  --paper: #fff;
  --sidebar-surface: #f3f3f0;
  --ink: #1e2827;
  --muted: #65716d;
  --quiet: #88938f;
  --rule: #dfe4df;
  --subtle: #eef2ee;
  --primary: #225d4c;
  --primary-hover: #184b3d;
  --primary-tint: #e9f3ee;
  --editor: #111821;
  --editor-divider: #293540;
  font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--ink);
  background: var(--canvas);
}
html {scroll-behavior: smooth;}
body {background: var(--canvas);}
button, input {font-family: inherit;}
button:focus-visible, input:focus-visible, textarea:focus-visible, .file-tab:focus-visible {outline: 2px solid #267e64;outline-offset: 2px;}
button:disabled {cursor: not-allowed;}
h1,h2,h3 {font-family: Inter,'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -.036em;}
::selection {background:#ccebd9;color:#1c3e32;}
::-webkit-scrollbar-thumb {background: #c3cbc6;border-radius:6px;}

/* Shell and primary navigation */
.sidebar {width:260px;min-width:260px;background:var(--sidebar-surface);border-right:1px solid var(--rule);}
.sidebar-top {padding:23px 22px 22px;border-color:var(--rule);}
.brand-button {gap:11px;color:var(--ink);}
.logo-symbol {width:37px;height:37px;border-radius:10px;background:var(--primary);color:white;font:750 14px/1 ui-monospace,SFMono-Regular,Consolas,monospace;box-shadow:none;}
.brand-text {font-family:inherit;font-size:22px;letter-spacing:-1.1px;font-weight:770;color:var(--ink);}
.brand-text>span {color:var(--primary);}
.brand-text small {font:650 9px/1.2 Inter,'Segoe UI',sans-serif;color:#75817b;letter-spacing:.045em;margin-top:6px;}
.sidebar-scroll {padding:23px 12px 22px;}
.sidebar-group {margin-bottom:23px;}
.sidebar-label {font-size:10px;letter-spacing:.09em;font-weight:750;color:#75807b;margin:0 12px 10px;}
.side-link,.course-link,.unit-toggle,.lesson-link {color:#5f6a65;}
.side-link {padding:10px 12px;gap:12px;font-size:12.5px;font-weight:590;border-radius:6px;}
.side-link>span:first-child {font-size:15px;color:#85908b;}
.side-link:hover,.side-link.selected {background:#e5ebe6;color:#215241;}
.side-count,.course-link small {color:#818c85;font-variant-numeric:tabular-nums;}
.side-search {height:39px;margin:7px 7px 24px;border-radius:7px;border:1px solid #d8dfd9;color:#78847d;background:#fff;}
.side-search:focus-within {border-color:#77a995;box-shadow:0 0 0 3px #d6e9df;}
.side-search input {font-size:12px;color:var(--ink);}
.side-search input::placeholder {color:#89958e;}
.course-link {margin-bottom:7px;padding:10px;border-radius:6px;color:var(--ink);}
.course-link:hover,.selected-course {background:#e6ebe7;}
.course-link>span:nth-child(2) {font-size:13px;font-weight:720;}
.course-link small {font-size:10.5px;}
.course-link>svg {color:#75817b;}
.js-logo,.ts-logo {border-radius:5px;width:31px;height:31px;}
.nav-unit {border-left:1px solid #d5ddd6;margin-left:15px;margin-bottom:4px;}
.unit-toggle {font-size:11.5px;padding:10px 11px;color:#6b7770;font-weight:650;}
.unit-toggle:hover {color:var(--ink);}
.lesson-link {border-radius:5px;font-size:11.5px;padding:9px 8px 9px 12px;line-height:1.38;}
.lesson-link:hover {color:var(--ink);background:#e9ede8;}
.lesson-link.active-lesson {color:#1c624a;background:#e0ece5;font-weight:690;}
.lesson-status {color:#a9b3ad;}
.lesson-status.done {color:#247f5c;}
.sidebar-bottom {background:#f3f3f0;border-color:var(--rule);padding:14px 19px;}
.avatar {background:#e1e8e1;color:#2b5c47;border:1px solid #ccdacd;font-size:13px;}
.sidebar-bottom strong {color:var(--ink);}
.sidebar-bottom small {color:#79857d;font-size:10px;}
.online-dot,.sync-dot,.welcome-dot,.workspace-status,.preview-status {width:6px;height:6px;background:#49866a;box-shadow:none;}

/* Top bar */
.main-pane {background:var(--canvas);}
.topbar {height:64px;padding:0 38px;background:#fff;backdrop-filter:none;border-color:var(--rule);}
.breadcrumbs {font-size:12px;color:#88948d;}
.breadcrumbs button {color:#6d7a71;}
.breadcrumbs span {color:#26342d;max-width:350px;}
.sync-label {font-size:11px;color:#79877e;}
.topbar-project {background:var(--paper);color:#285844;border:1px solid #cfdfd3;border-radius:6px;font-size:11.5px;padding:9px 11px;}
.topbar-project:hover {background:var(--primary-tint);}
.topbar-xp {background:#f4f5f0;color:#526351;border:1px solid #e2e6df;border-radius:5px;font-size:11px;font-weight:700;padding:8px 9px;}
.main-content {max-width:1520px;padding:42px 44px 78px;}
.main-content.page-lesson {padding:31px 35px 70px;}
.back-link {color:#75847a;font-size:12px;font-weight:560;margin-bottom:19px;}
.back-link:hover {color:var(--primary);}
.section-kicker {font-size:10.5px;font-weight:750;letter-spacing:.1em;color:#537366;}
.section-heading {margin-bottom:17px;}
.section-heading h2 {font-size:24px;margin:7px 0;color:var(--ink);}
.section-heading p {font-size:12.5px;color:var(--muted);}

/* Overview: dashboard for a real course, not marketing copy */
.welcome-overline {font-size:10px;letter-spacing:.12em;color:#69766e;margin-bottom:15px;}
.hero-banner {border:1px solid #293c35;background:#1f3029;border-radius:10px;min-height:275px;padding:36px 42px;gap:35px;}
.hero-banner::before {display:none;}
.hero-text {max-width:690px;}
.pill {background:#eff3ee;border:1px solid #d9e5db;color:#456451;padding:6px 9px;border-radius:4px;font-size:10px;letter-spacing:.03em;font-weight:690;}
.hero-chip {background:#2e4539;color:#d9e9dc;border-color:#435d4c;}
.hero-banner h1 {font-size:clamp(30px,3vw,40px);margin:18px 0 13px;line-height:1.19;letter-spacing:-.045em;color:#f5faf5;}
.hero-banner h1 em {color:#c5dfce;}
.hero-text>p {font-size:13.5px;max-width:540px;line-height:1.65;color:#c5d1c9;}
.hero-buttons {margin-top:22px;}
.button-primary {background:#dbeddb;border:1px solid #dbeddb;color:#153728;border-radius:6px;padding:11px 15px;font-weight:740;font-size:12px;box-shadow:none;}
.button-primary:hover {background:#f5fff1;border-color:#f5fff1;}
.button-ghost {background:transparent;border:1px solid #6f8777;color:#dcebe0;border-radius:6px;padding:11px 15px;font-size:12px;font-weight:630;}
.button-ghost:hover {background:#2c4338;}
.hero-art {min-width:260px;}
.hero-code-card {transform:none!important;border:1px solid #42574a;border-radius:8px;box-shadow:none;background:#182721;width:304px;height:199px;}
.window-dots {border-color:#384e40;}
.hero-code-lines {color:#d1ded1;}
.hero-code-lines b {color:#d0ca92;}
.hero-code-lines strong {color:#b4d3aa;}
.hero-code-lines .hero-comment {color:#799d89;}
.hero-float {display:none;}
.stats-grid,.project-stats {grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-top:17px;}
.stat {min-height:84px;border:0;border-right:1px solid var(--rule);background:var(--paper);border-radius:0;padding:16px 20px;gap:5px;}
.stat:last-child {border:0;}
.stat-icon {display:none;}
.stat strong {font-family:inherit;color:var(--ink);font-size:21px;font-weight:720;}
.stat>span:last-child {font-size:11px;color:#79847c;}
.micro-session {background:#edf2ed;border:1px solid #dce4dc;border-radius:8px;padding:19px 24px;}
.micro-session h2 {color:var(--ink);font-size:19px;}
.micro-session p {color:var(--muted);font-size:12px;}
.micro-session .button-primary {background:var(--primary);border-color:var(--primary);color:#fff;}
.micro-session .button-primary:hover {background:var(--primary-hover);}
.section-block {margin-top:39px;}
.tracks-grid {gap:15px;}
.track-card {background:#fff;border-color:var(--rule);border-radius:8px;padding:23px;min-height:315px;}
.track-card h3 {color:var(--ink);font-size:24px;}
.track-card>p {color:#67736b;min-height:56px;}
.track-meta,.progress-copy {color:#79877d;}
.progress-copy strong {color:var(--primary);}
.track-bottom {padding-top:16px;}
.progress-track {background:#e3e9e3;border-radius:7px;height:6px;overflow:hidden;}
.progress-fill {background:#3e8566;border-radius:7px;}
.project-feature {margin-top:25px;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:22px 24px;gap:17px;}
.feature-icon {background:#e6f0e8;color:var(--primary);border-radius:7px;}
.project-feature h3 {color:var(--ink);font-size:18px;}
.project-feature p {color:var(--muted);font-size:12px;}
.button-outline {border-color:#cbd9cc;color:var(--primary);border-radius:6px;background:#fff;font-size:12px;}
.button-outline:hover {color:#194232;border-color:#91b79c;background:#f5faf6;}
.footer-note {color:#88948a;font-size:11px;}

/* Course and roadmap */
.course-hero {background:#fff;border-color:var(--rule);border-radius:9px;padding:29px 31px;}
.course-hero h1 {color:var(--ink);}
.course-hero p,.course-metrics,.course-hint {color:var(--muted);}
.course-badge {width:66px;height:66px;border-radius:8px;font-size:24px;}
.course-progress {background:#fff;border-color:var(--rule);border-radius:8px;padding:17px 20px;}
.course-progress-top {color:var(--ink);}
.course-progress-top>span {color:var(--muted);}
.course-progress-top>span strong {color:var(--primary);}
.course-hint {background:#edf3ee;border-color:#dce6dd;}
.unit-card {background:#fff;border-color:var(--rule);border-radius:8px;}
.unit-path-card {border-left:1px solid var(--rule);}
.unit-card-head {border-color:var(--rule);min-height:102px;}
.unit-card h3 {color:var(--ink);}
.unit-card-head p,.unit-meta {color:var(--muted);}
.unit-number {background:#edf4ee;border:1px solid #d9e6dc;color:var(--primary);border-radius:6px;}
.unit-item {color:#35433a;border-radius:6px;}
.unit-item:hover {background:#f3f7f3;}
.unit-item-icon {border-color:#cbd7ce;color:#64766a;}
.unit-item-icon.completed {background:#e0f1e8;border-color:#a6d1b7;color:#297d58;}
.unit-item strong {color:var(--ink);}
.unit-item small,.unit-item-right {color:#7f8a81;}
.unit-verified {background:#f2f8f4;}
.project-hero {background:#fff;border-color:var(--rule);border-radius:9px;}
.project-hero h1,.project-hero h1 span {color:var(--ink);}
.project-hero p {color:var(--muted);}
.project-hero .button-primary {color:white;background:var(--primary);border-color:var(--primary);}
.project-stats {grid-template-columns:repeat(3,minmax(0,1fr));}
.project-board {background:white;border-color:var(--rule);border-radius:9px;}
.project-board-title h2,.project-unit-head strong,.project-todo strong {color:var(--ink);}
.project-board-title p,.project-todo p,.stage-desc {color:var(--muted);}
.project-unit {border-color:var(--rule);}
.project-stage {background:#f2f4f0;color:#52675a;border-color:#dae2d9;}
.project-check {border-color:#afc3b4;}
.project-check.checked {background:var(--primary);border-color:var(--primary);}
.link-open {color:var(--primary);}

/* Lesson typography and deliberate stepper */
.lesson-topline .back-link {margin-bottom:0;}
.lesson-counter {color:#86928a;letter-spacing:.08em;font-size:10px;}
.lesson-heading {margin:18px 0 23px;align-items:flex-end;}
.lesson-heading h1 {color:var(--ink);font-size:clamp(25px,2.6vw,36px);line-height:1.2;margin:7px 0 9px;}
.lesson-heading p {color:var(--muted);font-size:13px;}
.complete-button {background:#fff;color:#718078;border:1px solid var(--rule);border-radius:6px;padding:9px 11px;font-size:11px;font-weight:650;}
.complete-button.is-complete {background:#e8f4eb;color:#236345;border-color:#a5d1b6;}
.lesson-stage {background:#fff;border:1px solid var(--rule);border-radius:8px;padding:15px 18px;margin-bottom:18px;box-shadow:none;}
.stage-heading {margin-bottom:11px;}
.stage-heading>span:last-child {color:#718075;}
.stage-track {gap:8px;}
.stage-join {background:#d6ded7;height:1px;width:10px;}
.stage-btn {padding:10px 12px;background:#fafbf9;border:1px solid var(--rule);border-radius:6px;color:#66756a;font-size:11px;font-weight:650;transition:background .12s,border .12s;}
.stage-btn:hover {border-color:#95b3a1;}
.stage-btn.active {border:1px solid #367354;color:#19543b;background:#eaf4ed;box-shadow:none;}
.stage-btn.finished {color:#2c7352;}
.stage-no {width:22px;height:22px;min-width:22px;background:#ecefea;color:#5c6b5c;border-radius:5px;}
.stage-btn.active .stage-no {background:var(--primary);color:#fff;}
.stage-btn.finished .stage-no {background:#d9ecdf;color:#226e48;}
.lesson-layout {grid-template-columns:minmax(310px,.86fr) minmax(440px,1.14fr);gap:18px;}
.lesson-card {background:#fff;border:1px solid var(--rule);border-radius:8px;padding:23px 24px;margin-bottom:14px;}
.card-kicker,.card-kicker.mint,.card-kicker.purple {color:#507360;font-size:10px;letter-spacing:.075em;font-weight:740;}
.lesson-card h2 {color:var(--ink);font-size:20px;}
.lesson-card>p {color:#4d5e54;font-size:13px;line-height:1.77;}
.concept-list {background:#f5f8f4;border-color:#e1e8e0;border-radius:6px;padding:15px;}
.concept-list>strong {color:#304b3c;}
.concept-list span {color:#426b51;background:white;border-color:#cadfcd;font-size:11px;}
.sample-code {border-radius:6px;border-color:#313d45;background:var(--editor);}
.sample-top {background:#1b2630;border-color:#313e48;color:#a0afb9;}
.sample-top button {color:#d5dfe4;}
.sample-code pre {color:#c3e0c5;font-size:12px;}
.code-example .hint-note {color:var(--muted);font-size:11.5px;}
.challenge-card li {color:var(--muted);font-size:12px;}
.challenge-cta,.project-apply {background:#edf4ed;border:1px solid #bfd6c5;color:var(--primary);border-radius:6px;}
.challenge-cta:hover,.project-apply:hover {background:#e1efe4;}
.milestone-button {background:#fff;border-color:#d8e3d9;color:var(--primary);border-radius:6px;}
.milestone-button.done {background:#e9f4eb;color:#246b48;border-color:#bddac4;}
.mini-help {color:var(--muted)!important;}
.lesson-nav button {background:#fff;border-color:var(--rule);border-radius:6px;color:var(--ink);}
.lesson-nav small {color:var(--primary);}

/* Editors and preview remain dark for contrast and semantic separation */
.lab-pane {top:82px;}
.lab-head {margin-bottom:12px;}
.lab-live {color:#49715b;font-size:10px;letter-spacing:.07em;}
.lab-live span {background:#498866;box-shadow:none;}
.lab-head h2 {color:var(--ink);font-size:19px;}
.lab-head p {color:var(--muted);font-size:12px;}
.mode-switch {background:#e9eee9;border:1px solid #dfe5df;border-radius:7px;padding:4px;}
.mode-switch button {color:#536358;border-radius:5px;font-size:11.5px;font-weight:630;padding:10px;}
.mode-switch button.active {background:#fff;color:var(--primary);box-shadow:0 1px 3px #243a2a1a;}
.workspace,.preview-wrap,.console-panel {background:#131c25;border-color:#303d46;border-radius:7px;}
.workspace-bar {background:#1d2a33;border-color:#34414a;padding:11px 13px;}
.workspace-title {color:#d6dfe1;font-weight:680;letter-spacing:0;font-size:11px;}
.workspace-autosave {color:#a2b8ad;font-size:10px;}
.editor-tabs {background:#1b252f;border-color:#303d46;height:39px;}
.file-tab {background:transparent;color:#a1b0b8;border-color:#303c45;font-size:11px;padding:0 15px;}
.file-tab.tab-active {background:#111821;color:#f0f5f6;border-top:2px solid #8eba9d;}
.editor-area {background:var(--editor);}
.editor-actions {background:#1c2832;border-color:#35424c;padding:11px 12px;}
.editor-actions>span {color:#aab7bf;font-size:10px;}
.action-secondary,.run-button {border:1px solid #475563;border-radius:5px;background:#293746;color:#d9e4e8;padding:9px 11px;font-weight:650;font-size:11px;}
.action-secondary:hover {background:#334558;}
.run-button {border-color:#cde6d1;background:#d9eddd;color:#1e4a34;}
.run-button:hover {background:#f0fff2;}
.preview-wrap {margin-top:12px;}
.preview-head {background:#23313b;border-color:#394852;}
.preview-heading {color:#e2e9ed;font-weight:690;}
.preview-actions button {color:#b7c8d2;}
.preview-surface {height:244px;background:#f6f8f6;}
.preview-surface.mobile-surface {background:#26343f;}
.preview-foot {background:#1a2630;color:#bdc9d1;}
.console-panel {background:#1b2730;}
.console-toggle {color:#cedce2;}
.console-output {background:#111c24;color:#c5d2d8;}
.lab-tip {border-color:#d8e5db!important;background:#eff5ee!important;color:#52735b!important;border-radius:7px!important;}
.lab-tip p {color:#52665a!important;}
.lab-tip strong {color:#2e5740!important;}
.offline-editor {background:#111821;}
.editor-gutter {background:#18212b;border-color:#303e49;color:#71808a;}
.editor-code pre {color:#d6e1e7;}
.editor-code textarea {scrollbar-color:#475663 #111821;caret-color:#a5d1b4;}

/* Knowledge-check and validation: feedback colors mean something */
.quiz-card {background:#fff;border-color:var(--rule);}
.quiz-progress {color:#6e806f;letter-spacing:.06em;}
.quiz-progress span {color:#577b5d;}
.quiz-card h2 {color:var(--ink);font-size:19px;}
.quiz-choice {background:#fafbf9;color:#26382c;border-color:#dce5dc;border-radius:6px;min-height:50px;font-size:12.5px;}
.quiz-choice:hover {background:#f0f6ee;border-color:#8eb59a;}
.quiz-choice:focus-visible {outline-color:var(--primary);}
.quiz-choice.correct {background:#e4f4e8;color:#26613f;border-color:#97c8a5;}
.quiz-choice.incorrect {background:#fff2ef;color:#8c392f;border-color:#e4b6aa;}
.choice-letter {background:#edf0eb;color:#53665a;border-radius:5px;}
.feedback {border-radius:6px;}
.feedback.success {background:#e7f6eb;color:#2d6447;border-color:#b8ddc2;}
.feedback.issue {background:#fff2ec;color:#844736;border-color:#efcebb;}
.feedback button {background:var(--primary);color:#fff;border-radius:5px;}
.quiz-foot {color:#697b70;}
.hint-trigger {background:#f1f5ef;color:var(--primary);border-color:#d4e2d5;border-radius:5px;}
.validation-box {background:#fff;border-color:var(--rule);border-radius:7px;}
.validation-top {color:var(--ink);}
.validation-tag {color:#427659;}
.validation-box>p {color:var(--muted);font-size:12px;}
.check-button {background:var(--primary);color:#fff;border-radius:6px;}
.check-button:hover {background:var(--primary-hover);}
.validation-result {border-radius:5px;}
.validation-result.pass {background:#e6f4e8;color:#2a6845;}
.validation-result.fail {background:#fff0ed;color:#8c4b3b;}

/* Responsive refinement */
@media(max-width:1440px) {
  .main-content {padding-left:28px;padding-right:28px;}
  .main-content.page-lesson {padding:22px 23px 60px;}
  .lesson-layout {grid-template-columns:minmax(290px,.82fr) minmax(425px,1.18fr);}
}
@media(max-width:1160px) {
  .sidebar {width:236px;min-width:236px;}
  .lesson-layout {grid-template-columns:1fr;}
  .lab-pane {position:static;max-height:none;overflow:visible;}
  .stats-grid {grid-template-columns:repeat(2,minmax(0,1fr));}
  .stat:nth-child(2) {border-right:0;}
  .stat:nth-child(-n+2) {border-bottom:1px solid var(--rule);}
}
@media(max-width:860px) {
  .sidebar {width:270px;min-width:270px;}
  .topbar {padding:0 19px;}
  .main-content,.main-content.page-lesson {padding:25px 20px 60px;}
  .mobile-menu-btn,.close-sidebar {color:var(--ink);}
}
@media(max-width:660px) {
  .topbar {height:60px;}
  .main-content,.main-content.page-lesson {padding:20px 15px 48px;}
  .hero-banner {padding:25px 23px;min-height:0;}
  .hero-banner h1 {font-size:30px;}
  .hero-text>p {font-size:13px;}
  .hero-buttons .button-primary,.hero-buttons .button-ghost {width:100%;}
  .stats-grid {margin-top:13px;}
  .stat {padding:14px 13px;min-height:76px;}
  .stat strong {font-size:18px;}
  .micro-session {padding:19px;}
  .track-card {min-height:0;}
  .lesson-heading {display:block;margin-top:15px;}
  .lesson-heading h1 {font-size:28px;}
  .complete-button {display:inline-flex;margin-top:14px;white-space:normal;}
  .lesson-stage {padding:13px 11px;}
  .stage-btn {padding:9px 6px;font-size:10px;}
  .stage-no {width:22px;height:22px;}
  .lesson-card {padding:20px 18px;}
  .preview-surface {height:225px;}
  .editor-actions {flex-wrap:wrap;}
  .editor-actions>div {margin-left:auto;}
  .project-stats {grid-template-columns:1fr;}
  .stat {border-bottom:1px solid var(--rule);border-right:0;}
  .stat:last-child {border:0;}
}
@media(prefers-reduced-motion: reduce) { *,*::before,*::after {transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important;} }

/* Accessibility affordances shared by both frontends */
.skip-link {position:absolute;top:-60px;left:20px;z-index:100;background:white;color:#174b34;padding:11px 15px;border:2px solid #225d4c;border-radius:5px;text-decoration:none;font-size:13px;font-weight:700;}
.skip-link:focus {top:10px;}
.complete-button:not(.is-complete) {cursor:default;}
@media print {.sidebar,.topbar,.lab-pane,.lesson-stage,.hero-art {display:none!important;}.main-pane,.main-content {background:#fff!important;max-width:none!important;padding:0!important;} }
.track-bottom button,.track-bottom button:hover {color:var(--primary);}
.track-bottom button:focus-visible {outline:2px solid var(--primary);outline-offset:3px;}
@media(max-width:660px) {
  .topbar-project {white-space:nowrap;font-size:11px;padding:8px 10px;}
  .breadcrumbs span {max-width:128px;}
}

/* DevLab / Estudo dirigido v4 — componentes discretos e independentes. */
.learning-tools{display:grid;grid-template-columns:minmax(170px,.8fr) minmax(420px,1.7fr);align-items:center;gap:24px;background:var(--paper);border:1px solid var(--rule);padding:22px 24px;border-radius:9px;margin:0 0 24px;}
.learning-tools h2{font-size:18px;margin:6px 0 4px;color:var(--ink);letter-spacing:-.025em;}
.learning-tools p{color:var(--muted);font-size:12px;line-height:1.55;margin:0;}
.learning-tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.learning-tool{border:1px solid var(--rule);border-radius:7px;padding:15px 13px;display:flex;gap:11px;align-items:center;text-align:left;background:#fafbf9;color:var(--ink);min-width:0;transition:background .15s,border-color .15s;}
.learning-tool:hover{background:var(--primary-tint);border-color:#abc6b6;}
.learning-tool span:nth-child(2){flex:1;min-width:0;}
.learning-tool strong,.learning-tool small{display:block;}
.learning-tool strong{font-size:12px;line-height:1.4;}
.learning-tool small{font-size:10px;margin-top:4px;color:var(--muted);line-height:1.4;}
.learning-tool>span:last-child{font-size:17px;color:var(--primary);}
.learning-tool-symbol{width:33px;height:33px;flex:none;border:1px solid #d6e4da;display:grid;place-items:center;border-radius:6px;background:#e9f3ee;color:var(--primary);font-size:19px;}
.study-page{max-width:1120px;margin:0 auto;padding-bottom:50px;}
.study-page-header{margin-top:24px;padding-bottom:25px;border-bottom:1px solid var(--rule);}
.study-page-header h1{font-size:clamp(28px,3.4vw,39px);margin:7px 0 10px;color:var(--ink);}
.study-page-header p{max-width:690px;line-height:1.65;color:var(--muted);font-size:14px;margin:0;}
.study-figures{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:25px 0 24px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;overflow:hidden;}
.study-figures>div{padding:20px 23px;border-right:1px solid var(--rule);}
.study-figures>div:last-child{border:0;}
.study-figures strong{display:block;font-size:28px;line-height:1.2;font-weight:750;color:var(--ink);}
.study-figures span{display:block;font-size:11px;color:var(--muted);margin-top:7px;}
.review-card,.study-empty{border:1px solid var(--rule);border-radius:9px;background:#fff;padding:28px 30px;}
.review-card-top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:10px;font-weight:750;color:var(--muted);letter-spacing:.075em;margin-bottom:25px;}
.review-card-top span:last-child{font-weight:550;letter-spacing:0;}
.review-card h2{font-size:25px;max-width:650px;line-height:1.4;margin:0 0 20px;color:var(--ink);}
.review-note{font-size:13px;color:var(--muted);margin:0 0 20px;}
.review-card .button-primary{border-radius:6px;padding:12px 18px;font-size:12px;}
.review-answer{border-left:3px solid var(--primary);background:#f3f8f5;padding:18px 22px;margin-top:12px;margin-bottom:24px;}
.review-answer span{display:block;font-size:10px;letter-spacing:.1em;font-weight:800;color:var(--primary);margin-bottom:9px;}
.review-answer strong{display:block;font-size:19px;color:var(--ink);}
.review-answer p{font-size:13px;color:var(--muted);margin:8px 0 0;}
.review-rating{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.review-rating>span{font-size:13px;font-weight:650;color:var(--ink);}
.review-rating>div{display:flex;flex-wrap:wrap;gap:8px;}
.review-rating button{border:1px solid var(--rule);color:var(--ink);background:#fff;border-radius:6px;font-size:12px;font-weight:650;padding:10px 14px;}
.review-rating button:hover{border-color:var(--primary);background:var(--primary-tint);}
.study-empty h2{font-size:20px;}
.study-empty p{font-size:13px;color:var(--muted);}
.study-queue{margin-top:32px;}
.study-queue .section-heading{margin-bottom:15px;}
.review-list{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;}
.review-list-item{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--rule);}
.review-list-item:last-child{border:0;}
.review-list-item strong{font-size:13px;display:block;color:var(--ink);}
.review-list-item small{display:block;margin-top:6px;font-size:11px;color:var(--muted);}
.review-list-item button{flex:none;background:transparent;color:var(--primary);font-weight:700;font-size:11px;padding:8px 5px;}
.review-list-item button:hover{text-decoration:underline;}
.study-brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:28px;}
.brief-card{border:1px solid var(--rule);border-radius:9px;background:var(--paper);padding:23px 23px 20px;display:flex;flex-direction:column;gap:0;}
.brief-number{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--primary);}
.brief-number span{font-size:10px;letter-spacing:0;font-weight:650;color:var(--muted);border:1px solid var(--rule);padding:4px 7px;border-radius:4px;}
.brief-category{color:var(--muted);font-size:11px;margin:18px 0 7px;}
.brief-card h2{font-size:22px;margin:0 0 8px;color:var(--ink);}
.brief-card>p{color:var(--muted);font-size:12px;line-height:1.65;min-height:59px;margin:0 0 20px;}
.brief-objective{border-top:1px solid var(--rule);padding-top:15px;display:grid;gap:6px;}
.brief-objective strong{font-size:11px;color:var(--ink);}
.brief-objective span{font-size:12px;color:var(--muted);line-height:1.5;}
.brief-progress{margin:22px 0 17px;}
.brief-progress>span{font-size:10px;color:var(--muted);display:block;margin-bottom:8px;}
.brief-progress .progress-track{height:5px;}
.brief-card>.button-primary{align-self:flex-start;font-size:12px;padding:12px 15px;border-radius:6px;}
.brief-card details{margin-top:19px;padding-top:14px;border-top:1px solid var(--rule);}
.brief-card summary{font-weight:750;color:var(--primary);font-size:12px;cursor:pointer;}
.brief-card details small{font-size:10px;color:var(--muted);line-height:1.55;display:block;margin-top:10px;}
.brief-requirements{display:grid;gap:11px;padding:16px 0 3px;}
.brief-check-row{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--ink);line-height:1.5;cursor:pointer;}
.brief-check-row input{accent-color:var(--primary);margin:2px 0 0;flex:none;width:16px;height:16px;}
.study-footer,.study-muted{font-size:12px;color:var(--muted);margin:20px 0;line-height:1.6;}
.lesson-notes textarea{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:7px;min-height:98px;resize:vertical;background:#fafcfb;color:var(--ink);font-size:12px;line-height:1.6;font-family:inherit;}
.lesson-notes p{font-size:12px;color:var(--muted);margin:4px 0 12px;}
.lesson-notes .field-label{display:block;color:var(--ink);font-size:11px;font-weight:700;margin-bottom:7px;}
.lesson-notes small{display:block;margin-top:8px;font-size:10px;color:var(--muted);}
.mode-switch{flex-wrap:wrap;}
@media(max-width:1240px){.learning-tools{grid-template-columns:1fr;gap:16px;}}
@media(max-width:700px){.study-brief-grid{grid-template-columns:1fr;}.learning-tools{padding:17px;}.learning-tools-grid{grid-template-columns:1fr;}.study-figures>div{padding:14px 10px;}.study-figures strong{font-size:23px;}.study-figures span{font-size:10px;}.review-card,.study-empty{padding:20px 17px;}.review-card h2{font-size:21px;}.review-list-item{padding:14px 12px;}.brief-card{padding:19px 16px;}.review-rating{align-items:stretch;}.review-rating>div{width:100%;}.review-rating button{flex:1;min-width:112px;}.mode-switch button{flex:1;}}

/* Oficina: contratos legíveis, editor focado e resultados objetivos. */
.mission-promo{display:flex;justify-content:space-between;align-items:center;gap:24px;background:#eaf1ec;border:1px solid #d4e0d8;padding:21px 24px;margin:0 0 24px;border-radius:8px}
.mission-promo h2{font-size:19px;letter-spacing:-.025em;margin:5px 0;color:var(--ink)}
.mission-promo p{font-size:12px;max-width:590px;line-height:1.6;margin:0;color:var(--muted)}
.mission-promo .button-primary{white-space:nowrap;border-radius:6px;font-size:12px;padding:12px 17px}
.mission-stat{display:flex;align-items:baseline;gap:15px;padding:24px;margin:25px 0;background:#fff;border:1px solid var(--rule);border-radius:8px}
.mission-stat strong{font-size:23px;color:var(--ink)}
.mission-stat span{color:var(--muted);font-size:12px}
.mission-category{margin:35px 0}
.mission-category-head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:13px}
.mission-category-head h2{font-size:18px;font-weight:650;color:var(--ink);margin:7px 0 0}
.mission-category-head>span{font-size:12px;color:var(--muted);white-space:nowrap}
.mission-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mission-card{display:flex;flex-direction:column;padding:21px 22px;border:1px solid var(--rule);border-radius:8px;background:#fff;min-height:202px}
.mission-card-meta{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:10px;font-weight:650}
.mission-card h3{font-size:19px;letter-spacing:-.025em;margin:14px 0 7px;color:var(--ink)}
.mission-card p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 18px}
.mission-card-foot{border-top:1px solid var(--rule);padding-top:14px;margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mission-card-foot span{color:var(--muted);font-size:11px}
.mission-card-foot button{background:transparent;color:var(--primary);font-size:12px;font-weight:700;padding:7px}
.mission-card-foot button:hover{text-decoration:underline}
.mission-page{padding-bottom:50px}
.mission-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 22px}
.mission-top>span{font-size:12px;color:var(--muted)}
.mission-heading{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:26px}
.mission-heading h1{font-size:clamp(27px,3.1vw,37px);letter-spacing:-.035em;color:var(--ink);margin:7px 0 8px}
.mission-heading p{max-width:650px;font-size:13px;line-height:1.65;color:var(--muted);margin:0}
.mission-status{display:inline-block;border:1px solid var(--rule);background:#fff;color:var(--muted);font-size:11px;font-weight:650;padding:9px 12px;border-radius:6px;white-space:nowrap}
.mission-status.is-passed{background:#edf6f0;border-color:#b7d6c0;color:#24694c}
.mission-layout{display:grid;grid-template-columns:minmax(300px,0.81fr) minmax(450px,1.19fr);gap:19px;align-items:start}
.mission-spec,.mission-workspace{border:1px solid var(--rule);border-radius:8px;background:#fff;overflow:hidden}
.mission-section{padding:23px 24px;border-bottom:1px solid var(--rule)}
.mission-section:last-child{border:0}
.mission-section h2{font-size:18px;letter-spacing:-.025em;margin:7px 0 12px;color:var(--ink)}
.mission-section p{font-size:12px;line-height:1.75;color:var(--muted);margin:0}
.mission-section ul{padding-left:18px;margin:14px 0 0;display:grid;gap:11px}
.mission-section li{font-size:12px;line-height:1.55;color:var(--ink)}
.mission-section .signature{display:inline-block;background:#edf2ef;color:#21533e;padding:10px 12px;font-size:12px;border-radius:5px;white-space:normal;overflow-wrap:anywhere}
.mission-test-names{display:grid;gap:8px;margin-top:14px}
.mission-test-names span{font-size:11px;color:var(--ink);background:#f6f8f6;padding:9px 11px;border-radius:5px}
.mission-guidance p{margin-top:10px}
.mission-guidance details{margin-top:15px}
.mission-guidance summary{cursor:pointer;font-size:12px;color:var(--primary);font-weight:650}
.mission-workspace .workspace-bar{border-radius:0}
.mission-workspace .editor-tabs{border-radius:0}
.mission-workspace .offline-editor{border-radius:0}
.mission-editor{min-height:355px;max-height:520px}
.mission-editor textarea{min-height:355px}
.mission-editor-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #28323b;padding:13px 15px;background:#111a24}
.mission-editor-actions>span{font-size:10px;color:#9eaebc}
.mission-editor-actions>div{display:flex;gap:8px;flex-wrap:wrap}
.mission-editor-actions button{font-size:11px;border-radius:5px;padding:10px 12px}
.mission-editor-actions button:disabled{opacity:.6;cursor:progress}
.mission-results{border-top:1px solid var(--rule);padding:23px 23px 18px}
.mission-results-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mission-results-head h2{color:var(--ink);font-size:17px;margin:6px 0 12px}
.mission-results>p{font-size:12px;line-height:1.6;color:var(--muted)}
.mission-grade{font-size:10px;font-weight:750;white-space:nowrap;letter-spacing:.045em}
.mission-grade.passed{color:#24694c}
.mission-grade.failed{color:#a34f37}
.mission-report{display:grid;gap:7px}
.mission-result{display:flex;align-items:start;gap:10px;padding:12px 13px;background:#f7faf8;border:1px solid #e4ece6;border-radius:5px}
.mission-result.fail{background:#fff8f4;border-color:#f1d8ce}
.mission-result>span{font-size:15px;font-weight:800;color:#27794f}
.mission-result.fail>span{color:#b3513a}
.mission-result strong{font-size:12px;color:var(--ink)}
.mission-result small{display:block;font-size:11px;color:#8b4b3b;margin-top:5px;overflow-wrap:anywhere;line-height:1.5}
.mission-error{background:#fff4ef;color:#954f3b;border:1px solid #f0d3c6;padding:13px 14px;border-radius:6px;font-size:12px;line-height:1.55}
.mission-success{color:#24694c!important;font-weight:650}
@media(max-width:1180px){.mission-layout{grid-template-columns:1fr}.mission-spec{display:grid;grid-template-columns:1fr 1fr}.mission-section:nth-child(odd){border-right:1px solid var(--rule)}}
@media(max-width:700px){.mission-grid{grid-template-columns:1fr}.mission-heading{display:block}.mission-status{margin-top:12px}.mission-stat{display:grid;gap:6px}.mission-spec{display:block}.mission-section:nth-child(odd){border-right:0}.mission-section{padding:18px}.mission-results{padding:18px}.mission-promo{display:block;padding:17px}.mission-promo .button-primary{margin-top:14px}.mission-editor-actions{align-items:stretch}.mission-editor-actions>div{width:100%;display:grid;grid-template-columns:1fr 1fr}.mission-editor-actions .run-button{grid-column:1/-1}.mission-category-head{display:block}.mission-category-head>span{display:block;margin-top:10px}}

/* Sprint 8 — workspace editorial, sem substituir o editor didático das aulas. */
.main-content.page-workspace {max-width:1900px;padding:28px 28px 55px;}
.ws-page {width:100%;color:#20302b;}
.ws-page button {transition:background .15s,border-color .15s;}
.ws-page-heading {display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:0 0 24px;}
.ws-page-heading h1 {font-size:clamp(23px,2.7vw,32px);line-height:1.1;margin:8px 0;letter-spacing:-.05em;}
.ws-page-heading p {font-size:13px;color:#697570;margin:0;max-width:590px;line-height:1.6;}
.ws-header-actions {display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.ws-outline,.ws-main-button,.ws-toolbar>button {border:1px solid #cbd5ce;border-radius:6px;background:#fff;color:#304339;font-size:11px;font-weight:650;padding:10px 13px;}
.ws-outline:hover,.ws-toolbar>button:hover {background:#edf4ef;}
.ws-main-button {background:#23614b;color:#fff;border-color:#23614b;}
.ws-main-button:hover {background:#174e39;}
.ws-toolbar {height:auto;min-height:55px;display:flex;align-items:center;gap:10px;border:1px solid #dce3dc;border-bottom:0;padding:9px 14px;background:#f5f7f4;border-radius:8px 8px 0 0;}
.ws-toolbar-spacer {flex:1;}
.ws-select-wrap {display:flex;align-items:center;gap:9px;}
.ws-select-wrap label {font-size:11px;color:#67776c;font-weight:700;}
.ws-select-wrap select {max-width:220px;min-width:150px;border:1px solid #d4ddd6;background:white;border-radius:5px;padding:8px 9px;color:#22382c;font-size:12px;font-weight:650;}

.ws-storage {display:flex;align-items:center;gap:7px;font-size:10px;color:#748077;white-space:nowrap;}

.cl-home-actions .button-primary{max-width:100%;white-space:normal;text-align:left;font-size:12px}
.cl-secondary{background:#fff;border:1px solid #ccd9d1;color:#315343;border-radius:8px;padding:12px 16px;font-weight:670;font-size:12px;cursor:pointer}

.cl-home-progress strong{font-size:42px;letter-spacing:-.04em;color:#224c3e}.cl-home-progress strong span{color:#9cb3a5;font-size:21px}

.cl-section{padding:42px 0 7px}.cl-section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:19px}
.cl-section-head h2{font-size:23px;line-height:1.25;letter-spacing:-.025em;margin:7px 0 0}.cl-section-head p{font-size:12px;color:#7b8880;margin:0}
.cl-track-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.cl-track-item:hover{border-color:#89b7a0;background:#fbfdfb}.cl-track-item strong{font-size:19px;letter-spacing:-.02em;color:#284b3e}

.cl-list-actions button{display:grid;grid-template-columns:minmax(130px,1fr) minmax(0,1.6fr) auto;gap:18px;align-items:center;padding:19px 22px;border:0;border-bottom:1px solid var(--cl-line);background:#fff;width:100%;text-align:left;cursor:pointer;font-size:12px;color:#35624f}
.cl-list-actions button:last-child{border-bottom:0}.cl-list-actions button:hover{background:#f9fbf9}.cl-list-actions strong{color:#263f33;font-size:13px}
.cl-list-actions button span:nth-child(2){color:#7a8a7d}.cl-home-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:25px 2px 2px;margin-top:30px;border-top:1px solid var(--cl-line)}
.cl-home-footer p{font-size:13px;color:#667b6d;margin:0}.cl-home-footer button{font-size:12px;color:#236449;font-weight:700;background:transparent;border:0;cursor:pointer}
/* Lesson flow: only one pedagogical module visible at once. */
.cl-study-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:18px 0 20px;background:#fff;border:1px solid var(--cl-line);border-radius:10px;padding:7px}

.cl-study-tabs button:hover{background:#f3f7f3}.cl-study-tabs button.active{color:#245b45;background:#e9f3eb}
.cl-step-index{color:#78968a;font-size:10px;border:1px solid #d0dfd3;border-radius:999px;width:19px;height:19px;display:inline-grid;place-items:center;flex:none}
.cl-study-tabs button.active .cl-step-index{background:#377b5f;border-color:#377b5f;color:#fff}
.cl-study-tabs [aria-selected=true]{outline-offset:-2px}

.cl-next-step:hover{background:#164b36}
.ft-lesson-page,.be-lesson-page{max-width:990px;margin-inline:auto}

.cl-support-details{background:#fff;border:1px solid var(--cl-line);border-radius:9px;padding:0 18px;margin:0}

.cl-support-details summary::after{content:'+';font-size:17px;font-weight:500;color:#709280}.cl-support-details[open] summary::after{content:'−'}
.cl-support-details summary::-webkit-details-marker{display:none}
.cl-support-details .ft-aside-card,.cl-support-details .be-aside-card{border:0;padding:2px 0 20px;box-shadow:none;background:transparent}
.cl-support-details textarea{max-width:100%;min-height:130px}
.ft-lesson-page .ft-lesson-hero,.be-lesson-page .be-lesson-heading{padding:16px 0 10px;background:transparent;border:0;box-shadow:none}
.ft-lesson-page .ft-lesson-hero h1,.be-lesson-page .be-lesson-heading h1{font-size:clamp(26px,3vw,33px)}
.ft-lesson-page .ft-pager,.be-lesson-page .be-pager{margin-top:20px}
.career-page .career-hero{padding:28px 33px}
.career-page .career-hero h1{font-size:clamp(26px,3vw,34px)}
.career-page .career-projects{display:flex;flex-direction:column;gap:16px}
.career-page .career-catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.career-page .career-project-card{padding:16px;min-width:0;margin:0}
.career-page .career-project-card small{display:none}
.career-page .career-project-card strong{font-size:13px}
.career-page .career-project-card .career-card-footer{margin-top:9px}
.career-page .career-detail{min-width:0;width:100%;max-width:none;padding:27px 32px;border:1px solid var(--cl-line);background:#fff;box-shadow:none}
.career-detail>.cl-study-tabs{grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0 20px}
.career-page .career-detail-head{padding:0 0 8px;border-bottom:0}
.cl-career-panel{max-width:900px;padding:8px 0 20px}
.cl-career-panel h3{font-size:18px;margin:3px 0 12px}.cl-career-panel p{color:#667a6b;font-size:12px;line-height:1.7}
.cl-career-panel .career-checks{margin-top:14px}
.cl-career-panel .career-evidence{margin:0;padding:0;border:0}
.page-lesson.cl-lesson-learn .lab-pane{display:none!important}
.page-lesson.cl-lesson-learn .lesson-layout{grid-template-columns:minmax(0,800px);justify-content:center;max-width:900px}
.page-lesson.cl-lesson-learn .theory-pane{width:100%;max-width:100%}
/* Foco acessível, além de mouse e hover. */
.cl-sidebar button:focus-visible,.cl-sidebar input:focus-visible,.cl-home button:focus-visible,.cl-study-tabs button:focus-visible,.cl-next-step:focus-visible,.cl-support-details summary:focus-visible{outline:2px solid #276e50;outline-offset:2px}
@media(max-width:1160px){.cl-sidebar{width:215px}.cl-welcome{padding:32px}.cl-home{max-width:940px}}
@media(max-width:860px){.cl-sidebar{width:min(286px,86vw)}.cl-home{padding:0 3px}.cl-welcome{grid-template-columns:minmax(0,1fr)}.cl-home-progress{border-left:0;border-top:1px solid var(--cl-line);padding:14px 0 0}.cl-home-progress strong{font-size:30px}.cl-study-tabs{gap:3px}.cl-study-tabs button{flex-direction:column;gap:5px;font-size:11px;min-height:59px}.cl-track-grid{gap:10px}.cl-list-actions button{grid-template-columns:1fr auto;gap:6px}.cl-list-actions button span:nth-child(2){grid-row:2;grid-column:1}.career-page .career-detail{padding:21px}}
@media(max-width:600px){.cl-welcome{padding:26px 22px}.cl-welcome h1{font-size:30px}.cl-home-actions{flex-direction:column;align-items:stretch}.cl-home-actions button{width:100%;justify-content:center}.cl-section{padding-top:32px}.cl-section-head{align-items:start;flex-direction:column;gap:6px}.cl-track-grid{grid-template-columns:minmax(0,1fr)}.cl-track-item{padding:18px}.cl-list-actions button{padding:15px}.cl-home-footer{align-items:start;flex-direction:column}.cl-saving-status{font-size:10px}.cl-topbar .cl-current-location{max-width:42vw}.cl-study-tabs{padding:5px;gap:1px}.cl-study-tabs button{font-size:9px;min-width:0;white-space:normal;text-align:center;line-height:1.1;padding:8px 2px;gap:5px}.cl-step-index{width:17px;height:17px;font-size:9px}.ft-lesson-page .ft-panel,.be-lesson-page .be-panel{padding:21px 17px}.career-page .career-catalog{grid-template-columns:1fr;gap:6px}.career-page .career-project-card{padding:12px}.career-page .career-project-card .career-number,.career-page .career-project-card .career-card-footer{font-size:10px}.career-page .career-detail{padding:18px}.career-detail>.cl-study-tabs button{font-size:10px}.cl-home-footer button{padding:3px 0}.cl-topbar .cl-crumb-divider{display:none}}
@media(prefers-reduced-motion:reduce){.cl-track-item{transition:none}.cl-sidebar *{scroll-behavior:auto!important}}

#cl-nav-groups[hidden],#cl-search-results[hidden]{display:none!important}

/* Conteúdo de apoio em demanda, não mais outra faixa permanente na tela. */
.cl-course-method{border-top:1px solid var(--cl-line);margin-top:20px;color:#5b7564}
.cl-course-method>summary{padding:17px 4px;font-size:12px;font-weight:700;cursor:pointer}
.cl-course-method .ft-method,.cl-course-method .be-method-grid{margin-top:0}
.career-page .cl-git-help{padding:0 15px;margin:15px 0}
.career-page .cl-git-help .career-commands{padding:10px 0}

/* DevLab 13 — identidade dark minimalista. Fonte única de tema para build estático e React.
   Superfícies em grafite; branco para conteúdo; lilás somente para navegação/foco/progresso. */
:root{
 color-scheme:dark;
 --canvas:#0b0d12;--paper:#151820;--sidebar-surface:#0d0f15;
 --ink:#f2f3f7;--muted:#a7adbb;--quiet:#858e9f;--rule:#2c303b;
 --subtle:#1c202a;--primary:#aaa0fa;--primary-hover:#c4bdff;
 --primary-tint:#242237;--editor:#10131b;--editor-divider:#2c323c;
 --cl-text:#eff1f6;--cl-muted:#a1a8b5;--cl-line:#2b303b;
 --cl-soft:#161a22;--cl-green:#aea5ff;
 --text:#f0f1f6;--accent:#aea5ff;
}
html{background:var(--canvas);scrollbar-color:#373c49 var(--canvas)}
body,#root,.app-shell,.main-pane,.main-content{background:var(--canvas)!important;color:var(--ink)}
body{min-width:0}
*{scrollbar-color:#343a46 transparent}
::selection{background:#514a83;color:#fff}
button,input,select,textarea{font-family:inherit}
button,textarea,select,input{accent-color:var(--primary)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--primary)!important;outline-offset:3px}
button:disabled{cursor:not-allowed}
body h1,body h2,body h3,body h4{color:var(--ink)}
body p{color:var(--muted)}
body small,body .section-kicker,body .card-kicker,body .section-heading p{color:var(--quiet)}
body a{color:#c3bdff}
body a:hover{color:#e3dfff}
/* Identidade DevLab: símbolo somente tipográfico, sem cubo, degradê nem brilho. */
.sidebar.cl-sidebar,.cl-sidebar .sidebar-top,.cl-sidebar .sidebar-bottom{background:#0e1016!important;border-color:var(--rule)!important}
.sidebar.cl-sidebar{width:244px;min-width:244px}
.cl-sidebar .sidebar-top{padding:26px 20px 23px;border-bottom:1px solid var(--rule);min-height:90px}
.cl-sidebar .brand-button{gap:13px;align-items:center}
.cl-sidebar .logo-symbol,.sidebar .logo-symbol{font:800 23px/1 ui-monospace,Consolas,monospace;letter-spacing:-.12em;width:44px;height:40px;color:#f4f5fc!important;background:transparent!important;border:0!important;box-shadow:none!important;display:grid;place-items:center;white-space:nowrap;padding-right:4px}
.cl-sidebar .brand-text{font-size:23px!important;font-weight:790;color:#f2f3f8!important;letter-spacing:-.05em}
.cl-sidebar .brand-text small{font-size:8px!important;letter-spacing:.085em!important;color:#9a9fab!important;margin-top:7px}
.cl-sidebar .sidebar-scroll{padding:11px 12px 20px}
.cl-side-inner{gap:10px;padding:14px 0}
.cl-home-link,.cl-nav-link{color:#b6bbc8!important;border:1px solid transparent!important;background:transparent!important;border-radius:9px!important}
.cl-home-link{font-size:13px;font-weight:720;padding:12px}
.cl-nav-link{padding:10px 12px;font-size:12.5px}
.cl-home-link.active,.cl-nav-link.active{background:#272833!important;border-color:#383848!important;color:#f4f3fe!important}
.cl-home-link:hover,.cl-nav-link:hover{background:#1d2029!important;color:#fff!important}
.cl-nav-title,.cl-search-label{color:#7f8799!important;font-size:9.5px;letter-spacing:.12em;padding:14px 12px 8px}
.cl-nav-link small{color:#818997!important}.cl-nav-link.active small{color:#aca7d4!important}
.cl-sidebar #cl-nav-groups{display:grid;gap:9px}
.cl-sidebar-progress{display:flex;flex-direction:column;gap:10px;padding:20px 22px 24px!important}
.cl-sidebar-progress-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#e6e7ef}
.cl-sidebar-progress-head strong{font-size:15px;color:#f1efff}
.cl-sidebar-progress small{font-size:10px;color:#858b9a!important}
.cl-progress-track,.progress-track{height:6px;background:#292c37!important;border-radius:20px;overflow:hidden;display:block}
.cl-progress-track span,.progress-fill{height:100%;display:block;background:var(--primary)!important;border-radius:20px}
.sidebar-open{background:#0e1016!important}
/* Barra superior, busca e feedback de armazenamento */
.topbar.cl-topbar{background:#101218!important;border-bottom:1px solid var(--rule)!important;min-height:72px;height:72px;display:flex;align-items:center;padding:0 32px;gap:22px}
.cl-topbar .topbar-left{flex:0 1 auto;min-width:115px;gap:10px}
.cl-topbar .cl-top-home{color:#f0f1f7!important;font-size:13px}
.cl-topbar .cl-crumb-divider,.cl-topbar .cl-current-location{color:#7e8494!important}
.cl-top-search{position:relative;max-width:625px;flex:1;min-width:0;display:flex;align-items:center;height:42px;border:1px solid #333743;border-radius:9px;background:#1a1d26;color:var(--muted)}
.cl-top-search:focus-within{border-color:#7d75b8;box-shadow:0 0 0 2px #706b9830}
.cl-search-mark{font-size:24px;color:#9da5b3;margin:0 8px 0 13px;line-height:1}
#lesson-search{appearance:none;width:100%;min-width:0;border:0;outline:none!important;box-shadow:none!important;color:#f1f2f6;background:transparent;height:100%;font-size:12px;padding:0 10px 0 0}
#lesson-search::placeholder{color:#8e95a3}
.cl-search-shortcut{margin-right:12px;padding:4px 7px;border-radius:5px;background:#292d37;font-size:10px;color:#b3b8c4;white-space:nowrap}
.cl-search-results{position:absolute;top:calc(100% + 7px);left:0;right:0;background:#191c26!important;border:1px solid #393d4b!important;border-radius:9px;z-index:100;box-shadow:0 15px 36px #0008;padding:8px;max-height:70vh;overflow:auto;display:grid;gap:2px}
.cl-search-summary{color:#c9c9d9!important;padding:8px!important}
.cl-search-results button{color:#eff1f7!important;border-radius:6px}
.cl-search-results button:hover{background:#2a2e3a!important}
.cl-search-results small{color:#a4acbd!important}
.cl-topbar .cl-saving-status{color:#8f96a5!important;font-size:11px}.cl-topbar .cl-saving-status span{color:#a9a1fb!important}
/* Home sem painéis ornamentais. Dados sempre derivados do progresso real. */
.cl-home{max-width:1190px!important;color:var(--ink);padding:4px 0 55px!important}
.v13-home-top{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,.78fr);gap:16px}
.cl-welcome{min-width:0;min-height:292px;display:flex!important;justify-content:space-between;gap:10px;align-items:center;padding:38px 42px!important;background:#161820!important;border:1px solid var(--rule)!important;border-radius:13px!important;overflow:hidden}
.v13-hero-text{min-width:0;flex:1;position:relative;z-index:1}
.cl-welcome h1{color:#f7f7fb!important;font-size:clamp(27px,2.75vw,39px)!important;line-height:1.22;letter-spacing:-.04em;margin:15px 0 14px!important}
.cl-welcome p{color:#aeb4c2!important;font-size:13px;line-height:1.7;max-width:440px}
.cl-welcome .section-kicker{color:#a09dbb!important;font-size:9px}
.v13-hero-code{width:185px;min-width:100px;align-self:stretch;display:flex;align-items:center;justify-content:center;font:800 clamp(35px,5vw,80px)/1 ui-monospace,Consolas,monospace;letter-spacing:-.13em;color:#d6d3f7;opacity:.8;user-select:none;overflow:hidden}
.v13-hero-code span{transform:rotate(-8deg)}
.cl-home-actions{gap:9px;margin-top:24px}
.cl-home .button-primary,.button-primary,.ws-main-button,.cl-next-step{background:#f1f2f7!important;color:#15151c!important;border:1px solid #f1f2f7!important;border-radius:8px!important;font-weight:700;box-shadow:none!important}
.cl-home .button-primary:hover,.button-primary:hover,.ws-main-button:hover,.cl-next-step:hover{background:#daddf0!important;border-color:#daddf0!important;color:#14161c!important}
.cl-secondary,.button-outline,.ws-outline,.button-ghost{background:#1a1d26!important;color:#e3e4ef!important;border:1px solid #3e424f!important;border-radius:8px!important}
.cl-secondary:hover,.button-outline:hover,.ws-outline:hover,.button-ghost:hover{background:#282b37!important;color:#fff!important;border-color:#686582!important}
.v13-home-stats{display:grid;grid-template-rows:1fr 1fr;gap:13px;min-width:0}
.v13-progress-card,.v13-next-card{background:#161820;border:1px solid var(--rule);border-radius:13px;padding:22px 23px;min-width:0}
.v13-card-label{font-size:12px;font-weight:720;color:#f2f2f8}
.v13-progress-inner{display:flex;align-items:center;gap:20px;margin-top:20px}
.v13-ring{--progress:0%;width:89px;height:89px;min-width:89px;display:grid;place-items:center;position:relative;border-radius:50%;background:conic-gradient(#aea5ff var(--progress),#343644 0);}
.v13-ring:before{content:'';position:absolute;inset:11px;background:#161820;border-radius:50%}
.v13-ring span{position:relative;font-size:21px;font-weight:740;color:#f8f7fb}
.v13-progress-inner strong{font-size:15px;color:#fff;line-height:1.4}
.v13-progress-inner p,.v13-next-card p{font-size:11px;color:#8d94a4;line-height:1.5;margin:6px 0}
.v13-next-card strong{display:block;font-size:15px;margin-top:16px;line-height:1.5;color:#f6f5fb}
.v13-next-card button{background:transparent;border:0;color:#c5c0fc;font-size:12px;font-weight:700;padding:10px 0 0;cursor:pointer}
.v13-next-card button:hover{color:#fff}
.cl-section{padding:36px 0 0!important}.cl-section-head{margin-bottom:17px!important}
.cl-section-head h2{color:#f6f6fa!important;font-size:22px!important;letter-spacing:-.025em}
.cl-section-head p{color:#9ca4b2!important}
.cl-track-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:12px}
.cl-track-item{display:flex;background:#171a22!important;border:1px solid #30343f!important;border-radius:12px!important;gap:11px!important;min-height:205px;padding:22px!important}
.cl-track-item:hover{background:#20232d!important;border-color:#69627f!important;transform:none!important}
.v13-track-icon{height:42px;min-width:42px;padding:0 7px;border:1px solid #343844;background:#232531;border-radius:9px;color:#eeeefa;font:750 14px/1 ui-monospace,Consolas,monospace;display:grid;place-items:center}
.cl-track-item strong{color:#f1f2f7!important;font-size:18px!important}
.cl-track-item>span:nth-of-type(2){color:#a5acbc!important;font-size:12px;line-height:1.5;flex:1}
.v13-track-bottom{display:flex;justify-content:space-between;width:100%;gap:8px;color:#9ca4b4;font-size:11px;margin-top:7px}
.v13-track-bottom small{font-size:11px;color:#a8afbe!important}
.cl-track-item>.cl-progress-track{width:100%;height:5px}
.cl-list-actions{background:#171a22!important;border:1px solid var(--rule)!important;border-radius:11px!important}
.cl-list-actions button{background:#171a22!important;border-bottom:1px solid var(--rule)!important;color:#bfb9fa!important}

function searchLearningCatalog(query, items, limit=12){
  const terms=String(query??'').trim().toLocaleLowerCase('pt-BR').split(/\s+/u).filter(Boolean);
  if(!terms.length)return [];
  return items.filter(item=>terms.every(term=>(item.title+' '+(item.summary||'')+' '+(item.area||'')).toLocaleLowerCase('pt-BR').includes(term))).slice(0,limit);
}

function normalizeStudyStep(value, count=5){
  const step=Number(value);
  return Number.isInteger(step)&&step>=0&&step<count?step:0;
}

function careerFindProject(id){return careerProjects.find(p=>p.id===id)||null;}
function careerValidateRecord(project, record={}){
  const p=typeof project==='string'?careerFindProject(project):project;
  if(!p)throw new Error('Projeto não encontrado.');
  const checks=[...new Set((Array.isArray(record.checks)?record.checks:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<p.checks.length))].sort((a,b)=>a-b);
  const review=[...new Set((Array.isArray(record.review)?record.review:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<p.review.length))].sort((a,b)=>a-b);
  const sanitize=v=>String(v??'').slice(0,1600);
  const safeUrl=v=>{
    const value=String(v??'').trim().slice(0,500);
    if(!value)return '';
    try{const url=new URL(value);if(url.protocol!=='https:'||!url.hostname||url.username||url.password)return '';return url.toString().replace(/\(/g,'%28').replace(/\)/g,'%29');}catch{return '';}
  };
  return {checks,review,notes:sanitize(record.notes),testEvidence:sanitize(record.testEvidence),repo:safeUrl(record.repo),demo:safeUrl(record.demo)};
}
function careerProgress(project,record={}){
  const p=typeof project==='string'?careerFindProject(project):project;
  if(!p)throw new Error('Projeto não encontrado.');
  const v=careerValidateRecord(p,record);
  const all=p.checks.length+p.review.length;
  return {checked:v.checks.length,reviewed:v.review.length,total:all,percent:Math.round(100*(v.checks.length+v.review.length)/all),selfReported:v.checks.length===p.checks.length && v.review.length===p.review.length};
}
const md=s=>String(s??'').replace(/[\r\n]+/g,' ').replace(/[\\`*_{}[\]()#+!|<>]/g,'\\$&').trim();
function careerPortfolioMarkdown(profile={},records={}){
  const title=md(String(profile.name??'').slice(0,90))||'Estudante de desenvolvimento web';
  const about=md(String(profile.about??'').slice(0,800))||'Projetos de estudo e prática de engenharia de software.';
  const lines=[`# ${title}`,'',about,'','## Projetos',''];
  let listed=0;
  for(const project of careerProjects){
    const item=careerValidateRecord(project,records[project.id]||{});
    if(!item.repo&&!item.demo&&!item.notes&&!item.testEvidence&&!item.checks.length)continue;
    listed++;
    const progress=careerProgress(project,item);
    lines.push(`### ${md(project.title)}`,'',`**Tecnologias:** ${project.tech.map(md).join(', ')}`,'',md(item.notes||project.summary),'',`**Checklist registrado pelo estudante:** ${progress.checked}/${project.checks.length}. Revisão: ${progress.reviewed}/${project.review.length}. **Não representa certificação nem teste independente.**`,'');
    if(item.testEvidence)lines.push('**Evidência de teste:** '+md(item.testEvidence),'');
    if(item.repo)lines.push('- [Código-fonte]('+item.repo+')');
    if(item.demo)lines.push('- [Demonstração]('+item.demo+')');
    lines.push('');
  }
  if(!listed)lines.push('_Adicione evidências dos projetos para preencher esta seção._','');
  lines.push('---','', 'Portfólio de estudos gerado pelo DevLab. Links e evidências informados pelo estudante, não verificados automaticamente.','');
  return lines.join('\n');
}
const htmlEsc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function careerPortfolioHtml(profile={},records={}){
  const name=String(profile.name??'').slice(0,90).trim()||'Estudante de desenvolvimento web';
  const about=String(profile.about??'').slice(0,800).trim()||'Projetos de estudo e prática de engenharia de software.';

}
/** Simulador Git local. Não executa Git, não cria commits remotos. */
function gitInitial(){
  const initial={'index.html':'<h1>Primeira versão</h1>\n'};
  return {branch:'main',branches:{main:'c0'},commits:[{id:'c0',parent:null,message:'chore: projeto inicial',files:{...initial}}],working:{...initial},staged:{},output:'Repositório de estudo iniciado. Altere o arquivo, crie uma branch e experimente os comandos.',history:[]};
}
function gitHead(repo,branch=repo.branch){return repo.commits.find(c=>c.id===repo.branches[branch]);}
const gitClean=repo=>Object.keys(repo.staged).length===0&&Object.keys(repo.working).every(p=>repo.working[p]===gitHead(repo).files[p]);
function gitExecute(input,line){
  const repo=structuredClone(input),cmd=String(line??'').trim().slice(0,200);
  const result=(output,ok=true)=>({...repo,output,history:[...repo.history.slice(-24),{command:cmd,output,ok}]});
  const parts=cmd.split(/\s+/);
  if(cmd==='git status'){
    const modified=Object.keys(repo.working).filter(p=>repo.working[p]!==gitHead(repo).files[p]);
    return result(`Em ${repo.branch}\nEm staging: ${Object.keys(repo.staged).join(', ')||'(nenhum)'}\nModificados: ${modified.join(', ')||'(nenhum)'}\n${gitClean(repo)?'Árvore de trabalho limpa':'Há alterações locais.'}`);
  }
  if(cmd==='git branch')return result(Object.keys(repo.branches).map(b=>(b===repo.branch?'* ':'  ')+b).join('\n'));
  if(cmd==='git log --oneline'){
    let commit=gitHead(repo),lines=[];
    while(commit&&lines.length<15){lines.push(`${commit.id} ${commit.message}`);commit=repo.commits.find(c=>c.id===commit.parent);}
    return result(lines.join('\n'));
  }
  if(cmd==='git diff'){
    const old=gitHead(repo).files['index.html'],now=repo.working['index.html'];
    return result(old===now?'(sem alterações)':'--- a/index.html\n+++ b/index.html\n- '+old.trim()+'\n+ '+now.trim());
  }
  if(cmd==='git add index.html'){
    repo.staged['index.html']=repo.working['index.html'];return result('index.html adicionado ao staging.');
  }
  if(cmd==='git restore --staged index.html'){
    delete repo.staged['index.html'];return result('index.html removido do staging.');
  }
  if(parts[0]==='git'&&parts[1]==='switch'&&parts[2]==='-c'&&parts.length===4){
    const name=parts[3];if(!/^feat\/[a-z0-9][a-z0-9-]{1,28}$/.test(name))return result('Use um nome como feat/cabecalho.',false);
    if(Object.hasOwn(repo.branches,name))return result('Esta branch já existe.',false);
    repo.branches[name]=repo.branches[repo.branch];repo.branch=name;return result('Criada e selecionada '+name+'.');
  }
  if(parts.length===3&&parts[0]==='git'&&parts[1]==='switch'){
    const name=parts[2];if(!Object.hasOwn(repo.branches,name))return result('Branch não encontrada.',false);
    if(!gitClean(repo))return result('Faça commit ou descarte as alterações antes de trocar de branch.',false);
    repo.branch=name;repo.working={...gitHead(repo).files};return result('Agora em '+name+'.');
  }
  if(cmd.startsWith('git commit')){
    const match=cmd.match(/^git commit -m\s+(["'])(.{3,80})\1$/);
    if(!match)return result('Use git commit -m "mensagem objetiva".',false);
    if(!Object.keys(repo.staged).length||Object.keys(repo.staged).every(p=>repo.staged[p]===gitHead(repo).files[p]))return result('Não há alterações novas em staging.',false);
    const prev=gitHead(repo),id='c'+repo.commits.length;
    const next={id,parent:prev.id,message:match[2],files:{...prev.files,...repo.staged}};
    repo.commits.push(next);repo.branches[repo.branch]=id;repo.staged={};return result(`[${repo.branch} ${id}] ${match[2]}`);
  }
  if(parts.length===3&&parts[0]==='git'&&parts[1]==='merge'){
    const source=parts[2];if(!Object.hasOwn(repo.branches,source))return result('Branch de origem não encontrada.',false);
    if(!gitClean(repo))return result('Faça commit antes de tentar merge.',false);
    if(source===repo.branch)return result('Não é possível fazer merge da branch nela mesma.',false);
    let other=gitHead(repo,source);const current=gitHead(repo);const sourceFiles={...other.files};
    let cursor=other,ancestor=false;
    while(cursor){if(cursor.id===current.id){ancestor=true;break;}cursor=repo.commits.find(c=>c.id===cursor.parent);}
    if(!ancestor)return result('Históricos divergentes: neste laboratório o merge exige resolução manual de conflitos no Git real.',false);
    repo.branches[repo.branch]=other.id;repo.working=sourceFiles;return result(`Fast-forward de ${source} em ${repo.branch}.`);
  }
  return result('Comando não disponível nesta simulação. Consulte os exemplos ao lado.',false);
}
function gitEdit(repo,content){const result=structuredClone(repo);const value=String(content??'').slice(0,5000);result.working['index.html']=value;return result;}
function gitMilestones(repo){
  const feature=Object.keys(repo.branches).find(b=>b.startsWith('feat/'));
  const commits=feature?repo.commits.filter(c=>c.id!=='c0'&&c.message.startsWith('feat:')):[];
  const merged=Boolean(feature&&repo.branches.main===repo.branches[feature]&&commits.length);
  return {branch:Boolean(feature),commit:commits.length>0,merge:merged};
}

  'src/validation.js':`export function titleFrom(input){\n  if(typeof input!=='string')throw Object.assign(new Error('Informe um título em texto.'),{status:422});\n  const title=input.trim();\n  if(title.length<1||title.length>120)throw Object.assign(new Error('Título deve ter de 1 a 120 caracteres.'),{status:422});\n  return title;\n}\nexport function taskId(value){\n  if(!/^[1-9]\\d{0,9}$/.test(value))throw Object.assign(new Error('ID inválido.'),{status:400});\n  return Number(value);\n}\n`,

  'src/http.js':`export function sendJson(res,status,data,extra={}){\n  res.writeHead(status,{'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store','X-Content-Type-Options':'nosniff',...extra});\n  res.end(JSON.stringify(data));\n}\nexport async function readBody(req){\n  const mime=req.headers['content-type']||'';\n  if(!mime.toLowerCase().startsWith('application/json'))throw Object.assign(new Error('Use Content-Type: application/json.'),{status:415});\n  const chunks=[];let total=0;\n  for await(const chunk of req){total+=chunk.length;if(total>32_768)throw Object.assign(new Error('Corpo muito grande.'),{status:413});chunks.push(chunk);}\n  let parsed;try{parsed=JSON.parse(Buffer.concat(chunks).toString('utf8'));}catch{throw Object.assign(new Error('JSON inválido.'),{status:400});}\n  if(!parsed||Array.isArray(parsed)||typeof parsed!=='object')throw Object.assign(new Error('O corpo deve ser objeto JSON.'),{status:422});\n  return parsed;\n}\n`,
  'src/app.js':`import {createServer} from 'node:http';\nimport {memoryStore} from './store.js';\nimport {sendJson,readBody} from './http.js';\nimport {titleFrom,taskId} from './validation.js';\n\nexport function createApp(store=memoryStore()){\n  return createServer(async(req,res)=>{\n    try{\n      const url=new URL(req.url,'http://localhost');const path=url.pathname;const method=req.method;\n      if(path==='/health'){\n        if(method!=='GET')return sendJson(res,405,{error:'Método não permitido.'},{Allow:'GET'});\n        return sendJson(res,200,{status:'ok'});\n      }\n      if(path==='/tasks'){\n        if(method==='GET'){\n          const raw=url.searchParams.get('limit')??'20';\n          if(!/^[1-9]\\d{0,2}$/.test(raw)||Number(raw)>100)return sendJson(res,400,{error:'limit deve estar entre 1 e 100.'});\n          return sendJson(res,200,{items:store.list(Number(raw))});\n        }\n        if(method==='POST'){const body=await readBody(req);const task=store.create(titleFrom(body.title));return sendJson(res,201,task);}\n        return sendJson(res,405,{error:'Método não permitido.'},{Allow:'GET, POST'});\n      }\n      const match=path.match(/^\\/tasks\\/([^/]+)$/);\n      if(match){\n        const id=taskId(match[1]);\n        if(method==='GET'){const task=store.get(id);return task?sendJson(res,200,task):sendJson(res,404,{error:'Tarefa não encontrada.'});}\n        if(method==='PATCH'){const body=await readBody(req);if(typeof body.completed!=='boolean')return sendJson(res,422,{error:'completed deve ser booleano.'});const task=store.update(id,body.completed);return task?sendJson(res,200,task):sendJson(res,404,{error:'Tarefa não encontrada.'});}\n        if(method==='DELETE'){if(!store.remove(id))return sendJson(res,404,{error:'Tarefa não encontrada.'});res.writeHead(204);return res.end();}\n        return sendJson(res,405,{error:'Método não permitido.'},{Allow:'GET, PATCH, DELETE'});\n      }\n      return sendJson(res,404,{error:'Rota não encontrada.'});\n    }catch(err){const status=[400,413,415,422].includes(err?.status)?err.status:500;\n      if(status===500)console.error('Erro interno na API:',err?.message);\n      if(!res.headersSent)sendJson(res,status,{error:status===500?'Erro interno.':err.message});\n      else res.end();\n    }\n  });\n}\n`,
  'src/server.js':`import {createApp} from './app.js';\nconst port=Number(process.env.PORT??3001);\nif(!Number.isInteger(port)||port<1||port>65535)throw Error('PORT inválida.');\nconst server=createApp();\nserver.listen(port,'0.0.0.0',()=>console.log('TaskAPI em http://localhost:'+port));\nprocess.on('SIGTERM',()=>server.close());\n`,
  'test/api.test.js':`import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {once} from 'node:events';\nimport {createApp} from '../src/app.js';\n\ntest('API responde HTTP real e rejeita entradas inválidas',async()=>{\n  const server=createApp();server.listen(0,'127.0.0.1');await once(server,'listening');\n  const url='http://127.0.0.1:'+server.address().port;\n  try{\n    const health=await fetch(url+'/health');assert.equal(health.status,200);assert.deepEqual(await health.json(),{status:'ok'});\n    const invalid=await fetch(url+'/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:'   '})});assert.equal(invalid.status,422);\n    const wrong=await fetch(url+'/tasks',{method:'POST',headers:{'content-type':'application/json'},body:'{' });assert.equal(wrong.status,400);\n    const created=await fetch(url+'/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:'  Estudar Node  '})});assert.equal(created.status,201);const task=await created.json();assert.equal(task.title,'Estudar Node');\n    const list=await fetch(url+'/tasks');assert.equal((await list.json()).items.length,1);\n    const update=await fetch(url+'/tasks/'+task.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({completed:true})});assert.equal(update.status,200);assert.equal((await update.json()).completed,true);\n    const removed=await fetch(url+'/tasks/'+task.id,{method:'DELETE'});assert.equal(removed.status,204);\n    const missing=await fetch(url+'/tasks/'+task.id);assert.equal(missing.status,404);\n  }finally{await new Promise((resolve,reject)=>server.close(err=>err?reject(err):resolve()));}\n});\n`,

/** Simulador pedagógico determinístico HTTP. Não é uma API nem sistema de autenticação. */
const backendLabInitial=()=>({items:[{id:1,title:'Organizar a API',completed:false,owner:'alice'},{id:2,title:'Revisar SQL',completed:false,owner:'bob'}],nextId:3});
const result=(state,status,body,headers={})=>({state,status,body,headers:{'Content-Type':'application/json',...headers}});
function simulateBackendRequest(state,{method='GET',path='/health',body='',role='guest'}={}){
 if(!state || !Array.isArray(state.items) || !Number.isInteger(state.nextId))throw Error('Estado do laboratório inválido.');
 const current={items:state.items.map(x=>({...x})),nextId:state.nextId};
 const allowedRoles=['guest','alice','bob','admin'];if(!allowedRoles.includes(role))throw Error('Perfil inválido.');
 const verb=String(method).toUpperCase();let url;
 try{url=new URL(String(path),'https://simulador.devlab.invalid');}catch{return result(current,400,{error:'URL inválida.'});}
 if(url.origin!=='https://simulador.devlab.invalid')return result(current,400,{error:'Use um caminho local como /tasks.'});
 const pathname=url.pathname;
 if(pathname==='/health')return verb==='GET'?result(current,200,{status:'ok'}):result(current,405,{error:'Método não permitido.'},{Allow:'GET'});
 if(!['/tasks','/admin/users'].includes(pathname)&&!/^\/tasks\/\d+$/.test(pathname))return result(current,404,{error:'Rota não encontrada.'});
 if(role==='guest')return result(current,401,{error:'Autenticação necessária.'});
 if(pathname==='/admin/users')return role!=='admin'?result(current,403,{error:'Permissão insuficiente.'}):verb!=='GET'?result(current,405,{error:'Método não permitido.'}):result(current,200,{users:['alice','bob','admin']});
 let payload={};if(['POST','PATCH','PUT'].includes(verb)){
  try{payload=JSON.parse(body||'{}');}catch{return result(current,400,{error:'JSON inválido.'});}
  if(!payload || Array.isArray(payload)||typeof payload!=='object')return result(current,422,{error:'O corpo deve ser objeto.'});
 }
 if(pathname==='/tasks'){
  if(verb==='GET')return result(current,200,{items:current.items.filter(t=>role==='admin'||t.owner===role)});
  if(verb==='POST'){
   if(typeof payload.title!=='string'||!payload.title.trim()||payload.title.trim().length>120)return result(current,422,{error:'Título deve ter de 1 a 120 caracteres.'});
   const task={id:current.nextId++,title:payload.title.trim(),completed:false,owner:role};current.items.push(task);return result(current,201,task);
  }
  return result(current,405,{error:'Método não permitido.'},{Allow:'GET, POST'});
 }
 const id=Number(pathname.split('/')[2]);const task=current.items.find(t=>t.id===id && (role==='admin'||t.owner===role));
 if(!task)return result(current,404,{error:'Tarefa não encontrada.'});
 if(verb==='GET')return result(current,200,task);
 if(verb==='PATCH'){
  if(typeof payload.completed!=='boolean')return result(current,422,{error:'completed deve ser booleano.'});
  task.completed=payload.completed;return result(current,200,task);
 }
 if(verb==='DELETE'){current.items=current.items.filter(t=>t.id!==id);return result(current,204,null);}
 return result(current,405,{error:'Método não permitido.'},{Allow:'GET, PATCH, DELETE'});
}

/** Bloqueia alguns padrões de loops sem condição de saída antes de montar a prévia.
 * Não é prova formal de terminação: loops gerais exigem isolamento de processo.
 */
function codeOnly(source) {
  const input=String(source||'');let result='',i=0,state='code';
  while(i<input.length){const ch=input[i],next=input[i+1];
    if(state==='code'){
      if(ch==='/'&&next==='/'){state='line';result+='  ';i+=2;continue;}
      if(ch==='/'&&next==='*'){state='block';result+='  ';i+=2;continue;}
      if(ch==='\''||ch==='"'||ch==='`'){state=ch;result+=' ';i++;continue;}
      result+=ch;i++;continue;
    }
    if(state==='line'){if(ch==='\n'){state='code';result+='\n';}else result+=' ';i++;continue;}
    if(state==='block'){if(ch==='*'&&next==='/'){state='code';result+='  ';i+=2;}else{result+=ch==='\n'?'\n':' ';i++;}continue;}
    if(ch==='\\'){result+='  ';i+=Math.min(2,input.length-i);continue;}
    if(ch===state)state='code';result+=ch==='\n'?'\n':' ';i++;
  }
  return result;
}
function previewSafetyWarning(script){
  if(String(script||'').length>35000)return 'A prévia ultrapassa 35 mil caracteres de JavaScript. Divida o projeto em arquivos menores.';
  const code=codeOnly(script);
  if(/\bwhile\s*\(\s*(?:true|1)\s*\)/.test(code)||/\bfor\s*\(\s*;\s*;\s*\)/.test(code))
    return 'A prévia bloqueou um laço sem condição explícita (while(true) ou for(;;)). Reescreva com uma condição de saída verificável.';
  return null;
}

/** Confere assinaturas TS com AST; não substitui typecheck completo com libs DOM. */
function inspectTypeScriptContract(ts, source, contract) {
  if (contract.language !== 'ts') return [];
  const root=ts.createSourceFile('solution.ts',source,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS);
  const syntax=[...root.parseDiagnostics];
  if(syntax.length) return [{label:'Código TypeScript sem erros de sintaxe.',ok:false}];
  const fn=root.statements.find(node=>ts.isFunctionDeclaration(node)&&node.name?.text===contract.functionName);
  const checks=[{label:'Função '+contract.functionName+' declarada com TypeScript.',ok:!!fn}];
  if(!fn)return checks;
  const fmt=(node)=>node?.getText(root).replace(/\s+/g,'').toLowerCase()||'';
  const req=contract.typeRequirements;
  checks.push({label:'Todos os parâmetros possuem anotações de tipo.',ok:fn.parameters.length===req.parameters&&fn.parameters.every(p=>Boolean(p.type))});
  if(req.arrayParameter)checks.push({label:'A função recebe um array tipado.',ok:fn.parameters.some(p=>fmt(p.type).includes('[]')||fmt(p.type).startsWith('array<'))});
  checks.push({label:'O tipo de retorno corresponde ao contrato.',ok:fmt(fn.type)===req.returns.replace(/\s+/g,'').toLowerCase()});
  if(req.generic)checks.push({label:'A função declara um parâmetro genérico T.',ok:fn.typeParameters?.some(p=>p.name.text==='T')===true});
  if(req.interfaceName){
    const iface=root.statements.find(node=>ts.isInterfaceDeclaration(node)&&node.name.text===req.interfaceName);
    const fields=new Map(iface?.members.filter(ts.isPropertySignature).map(m=>[m.name.getText(root),fmt(m.type)])||[]);
    checks.push({label:'Interface Tarefa declara id, titulo e concluida com tipos corretos.',ok:!!iface&&fields.get('id')==='number'&&fields.get('titulo')==='string'&&fields.get('concluida')==='boolean'});
  }
  return checks;
}

function localDateKey(date=new Date()) {
 return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
}
function streakDays(days, now=new Date()) {
 const set=new Set(days);
 let day=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 if(!set.has(localDateKey(day))) day.setDate(day.getDate()-1);
 let total=0;
 while(set.has(localDateKey(day))){total++;day.setDate(day.getDate()-1);}
 return total;
}

const behaviorLessonIds = Object.freeze([
