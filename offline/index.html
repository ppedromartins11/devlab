/** Bloqueia alguns padrões de loops sem condição de saída antes de montar a prévia.
 * Não é prova formal de terminação: loops gerais exigem isolamento de processo.
 */
function codeOnly(source) {
  const input=String(source||'');let result='',i=0,state='code';
  while(i<input.length){const ch=input[i],next=input[i+1];
    if(state==='code'){
      if(ch==='/'&&next==='/'){state='line';result+='  ';i+=2;continue;}
      if(ch==='/'&&next==='*'){state='block';result+='  ';i+=2;continue;}
      if(ch==='\''||ch==='"'||ch==='`'){state=ch;result+=' ';i++;continue;}
      result+=ch;i++;continue;
    }
    if(state==='line'){if(ch==='\n'){state='code';result+='\n';}else result+=' ';i++;continue;}
    if(state==='block'){if(ch==='*'&&next==='/'){state='code';result+='  ';i+=2;}else{result+=ch==='\n'?'\n':' ';i++;}continue;}
    if(ch==='\\'){result+='  ';i+=Math.min(2,input.length-i);continue;}
    if(ch===state)state='code';result+=ch==='\n'?'\n':' ';i++;
  }
  return result;
}
function previewSafetyWarning(script){
  if(String(script||'').length>35000)return 'A prévia ultrapassa 35 mil caracteres de JavaScript. Divida o projeto em arquivos menores.';
  const code=codeOnly(script);
  if(/\bwhile\s*\(\s*(?:true|1)\s*\)/.test(code)||/\bfor\s*\(\s*;\s*;\s*\)/.test(code))
    return 'A prévia bloqueou um laço sem condição explícita (while(true) ou for(;;)). Reescreva com uma condição de saída verificável.';
  return null;
}

/** Confere assinaturas TS com AST; não substitui typecheck completo com libs DOM. */
function inspectTypeScriptContract(ts, source, contract) {
  if (contract.language !== 'ts') return [];
  const root=ts.createSourceFile('solution.ts',source,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS);
  const syntax=[...root.parseDiagnostics];
  if(syntax.length) return [{label:'Código TypeScript sem erros de sintaxe.',ok:false}];
  const fn=root.statements.find(node=>ts.isFunctionDeclaration(node)&&node.name?.text===contract.functionName);
  const checks=[{label:'Função '+contract.functionName+' declarada com TypeScript.',ok:!!fn}];
  if(!fn)return checks;
  const fmt=(node)=>node?.getText(root).replace(/\s+/g,'').toLowerCase()||'';
  const req=contract.typeRequirements;
  checks.push({label:'Todos os parâmetros possuem anotações de tipo.',ok:fn.parameters.length===req.parameters&&fn.parameters.every(p=>Boolean(p.type))});
  if(req.arrayParameter)checks.push({label:'A função recebe um array tipado.',ok:fn.parameters.some(p=>fmt(p.type).includes('[]')||fmt(p.type).startsWith('array<'))});
  checks.push({label:'O tipo de retorno corresponde ao contrato.',ok:fmt(fn.type)===req.returns.replace(/\s+/g,'').toLowerCase()});
  if(req.generic)checks.push({label:'A função declara um parâmetro genérico T.',ok:fn.typeParameters?.some(p=>p.name.text==='T')===true});
  if(req.interfaceName){
    const iface=root.statements.find(node=>ts.isInterfaceDeclaration(node)&&node.name.text===req.interfaceName);
    const fields=new Map(iface?.members.filter(ts.isPropertySignature).map(m=>[m.name.getText(root),fmt(m.type)])||[]);
    checks.push({label:'Interface Tarefa declara id, titulo e concluida com tipos corretos.',ok:!!iface&&fields.get('id')==='number'&&fields.get('titulo')==='string'&&fields.get('concluida')==='boolean'});
  }
  return checks;
}

function localDateKey(date=new Date()) {
 return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');

function streakDays(days, now=new Date()) {
 const set=new Set(days);
 let day=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 if(!set.has(localDateKey(day))) day.setDate(day.getDate()-1);
 let total=0;
 while(set.has(localDateKey(day))){total++;day.setDate(day.getDate()-1);}
 return total;
}

/**
 * Verificações comportamentais da prévia isolada. Nenhuma solução é executada
 * no contexto da aplicação principal; a função é serializada para o iframe.
 * A validação é por resultados observáveis, sem exigir nomes de variáveis.
 */
const behaviorLessonIds = Object.freeze([
  'primeiros-passos', 'operadores', 'debug-console', 'loops', 'arrays',
  'dom-basico', 'eventos', 'formularios', 'renderizacao', 'api-json',

]);

function assessLessonBehavior(id, doc, observedLogs) {
  const checks = [];
  const add = (label, ok) => checks.push({label, ok: Boolean(ok)});
  const one = selector => doc.querySelector(selector);
  const many = selector => [...doc.querySelectorAll(selector)];
  const text = selector => one(selector)?.textContent?.trim() ?? '';
  const click = selector => {const el=one(selector);if(el)el.click();return Boolean(el);};
  const input = (el, value) => { if (!el) return false;el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));return true; };
  const submit = selector => {const el=one(selector);return el?.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));};
  const count = () => many('#list li').length;
  const resultValue = () => text('#result');
  switch(id) {
    case 'primeiros-passos': {
      const beforeTitle=text('#title'),beforeResult=resultValue();
      add('O botão existe e pode ser acionado.',click('#action'));
      add('O clique altera o título.',text('#title')!==beforeTitle);
      add('O clique altera a mensagem exibida.',resultValue()!==beforeResult);
      break;
    }
    case 'operadores': {
      add('O percentual de 3 tarefas em 8 é exibido corretamente.',/37[.,]5\s*%?/.test(resultValue()));
      break;
    }
    case 'debug-console': {
      add('A depuração mostra o resultado de dobrar 4 (= 8).',observedLogs.some(e=>e.level==='log'&&e.values.some(v=>/(?:^|\D)8(?:\D|$)/.test(v))));
      break;
    }
    case 'loops': {
      add('A lista tem exatamente cinco itens.',count()===5);
      add('Os cinco itens possuem texto visível.',many('#list li').every(el=>el.textContent.trim().length>0));
      break;
    }
    case 'arrays': {
      const items=many('#list li').map(el=>el.textContent.trim());
      add('Três tarefas estão renderizadas.',items.length>=3);
      add('A lista não contém tarefas vazias.',items.length>0&&items.every(Boolean));
      break;
    }
    case 'dom-basico': {
      const title=one('#title'),button=one('#action');
      if(!title||!button) {add('Título e botão estão presentes.',false);break;}
      const beforeText=title.textContent, beforeClass=title.classList.contains('destaque');
      button.click();
      add('Clicar altera o texto do título.',title.textContent!==beforeText);
      add('O clique alterna a classe destaque.',title.classList.contains('destaque')!==beforeClass);
      button.click();
      add('O segundo clique reverte a classe destaque.',title.classList.contains('destaque')===beforeClass);
      break;
    }
    case 'eventos': {
      const field=one('#name'),out=one('#result');
      if(!field||!out){add('Campo e resultado estão presentes.',false);break;}
      const before=out.textContent;
      input(field,'Ada Lovelace');
      add('A página responde ao primeiro texto digitado.',out.textContent.includes('Ada Lovelace'));
      input(field,'Grace Hopper');
      add('A página responde a um segundo texto, sem ficar com o antigo.',out.textContent.includes('Grace Hopper')&&!out.textContent.includes('Ada Lovelace'));
      add('O resultado não permanece igual ao inicial.',out.textContent!==before);
      break;
    }
    case 'formularios': {
      const form=one('#task-form'),field=one('#task-title');
      if(!form||!field){add('Formulário e campo estão presentes.',false);break;}
      const start=count();
      input(field,'  Estudar DOM  ');
      const dispatched=submit('#task-form');
      const items=many('#list li');
      add('Enviar não provoca navegação ou recarga.',dispatched===false);
      add('Enviar uma tarefa acrescenta um item na lista.',items.length===start+1);
      add('O título da tarefa é exibido sem espaços extras.',items.some(el=>el.textContent.trim()==='Estudar DOM'));
      add('O campo é limpo após cadastrar.',field.value==='');
      input(field,'  ');submit('#task-form');
      add('Uma tarefa vazia não pode ser cadastrada.',count()===start+1);
      break;
    }
    case 'renderizacao': {
      const out=one('#result'),button=one('#action');
      if(!out||!button){add('Contador e botão estão presentes.',false);break;}
      const before=out.textContent;
      button.click();const first=out.textContent;
      button.click();const second=out.textContent;
      add('O primeiro clique atualiza o contador.',first!==before&&/\b1\b/.test(first));
      add('O segundo clique incrementa novamente.',second!==first&&/\b2\b/.test(second));
      break;
    }
    case 'api-json': {
      const texts=many('#list li').map(el=>el.textContent.trim());
      add('Duas tarefas são mostradas após interpretar o JSON.',texts.length===2);
      add('A lista mostra os títulos de ambos os objetos.',texts.some(t=>t.includes('Ler documentação'))&&texts.some(t=>t.includes('Criar projeto')));
      break;
    }
    case 'storage': {
      const field=one('#result'),button=one('#action');
      if(!field||!button){add('Botão e resultado estão disponíveis.',false);break;}
      const raw=localStorage.getItem('contador');
      const before=Number(raw||0);
      button.click();
      const saved=Number(localStorage.getItem('contador'));
      add('O clique salva uma contagem incrementada.',Number.isFinite(saved)&&saved===before+1);
      add('O valor salvo aparece na interface.',new RegExp('(?:^|\\D)'+saved+'(?:\\D|$)').test(field.textContent));
      break;
    }
    case 'acessibilidade': {
      const field=one('#name'),label=one('label[for="name"]'),status=one('#status'),form=one('#form');
      add('Campo tem um label associado pelo id.',Boolean(field&&label&&label.control===field));
      add('Mensagem de status utiliza aria-live.',Boolean(status&&['polite','assertive'].includes(status.getAttribute('aria-live'))));
      if(!field||!form||!status){add('Formulário apresenta confirmação ao enviar.',false);break;}
      const before=status.textContent;
      input(field,'DevLab');submit('#form');
      add('Formulário apresenta confirmação ao enviar.',status.textContent.trim().length>0&&status.textContent!==before);
      break;
    }
    default: {
      add('Esta aula ainda não tem testes comportamentais.',false);
    }
  }
  return checks;
}


/** Gera uma página executada EXCLUSIVAMENTE num iframe sandbox="allow-scripts".
 *  O usuário pode editar HTML/CSS/JS/TS, mas não acessa a página hospedeira. */
function jsonSafe(value) {
  return JSON.stringify(value).replace(/</g, '\\u003c').replace(/\u2028|\u2029/g, ' ');
}

function buildPreview({ html, css, js, token, stored = {} }) {
  const cssSafe = String(css).replace(/<\/style/gi, '<\\/style');
  const script = String(js);
  const assessmentFunction = assessLessonBehavior.toString();
  return `<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${cssSafe}</style>
<script>
(() => {
  const token = ${jsonSafe(token)};
  const memoria = ${jsonSafe(stored)};
  const send = (kind, payload) => parent.postMessage({ __devlab: true, token, kind, payload }, '*');
  const toText = (value) => {
    if (typeof value === 'string') return value;
    if (value instanceof Error) return value.message;
    try { return JSON.stringify(value); } catch { return String(value); }
  };
  const storage = {
    get length() { return Object.keys(memoria).length; },
    key(i) { return Object.keys(memoria)[i] ?? null; },
    getItem(k) { return Object.hasOwn(memoria, String(k)) ? memoria[String(k)] : null; },
    setItem(k, v) { memoria[String(k)] = String(v); send('storage', memoria); },
    removeItem(k) { delete memoria[String(k)]; send('storage', memoria); },
    clear() { for (const key of Object.keys(memoria)) delete memoria[key]; send('storage', memoria); }
  };
  try { Object.defineProperty(window, 'localStorage', { configurable: true, value: storage }); }
  catch (error) { send('log', { level: 'warn', args: ['Armazenamento virtual indisponível: ' + error.message] }); }
  for (const level of ['log', 'warn', 'error', 'info', 'debug']) {
    const native = console[level]?.bind(console);
    console[level] = (...args) => {
      send('log', { level, args: args.map(toText) });
      native?.(...args);
    };
  }
  window.addEventListener('error', event => send('log', {level:'error', args:[event.message]}));
  window.addEventListener('unhandledrejection', event => send('log', {level:'error',args:[toText(event.reason)]}));
  const observedLogs=[];
  // A verificação executa no iframe, nunca na origem da plataforma.
  for (const level of ['log','error']) {
    const previous = console[level];
    console[level] = (...args) => { observedLogs.push({level,values:args.map(toText)}); previous(...args); };
  }
  window.addEventListener('message', event => {
    const msg=event.data;
    if(event.source!==parent || !msg || msg.__devlab_check!==true || msg.token!==token)return;
    const report=(checks)=>send('check-result',{id:msg.id,nonce:msg.nonce,checks});
    try { report((${assessmentFunction})(msg.id,document,observedLogs)); }
    catch(error) { report([{label:'Erro ao executar os testes: '+toText(error),ok:false}]); }
  });
  send('ready', null);
})();
<\/script></head><body>${html}
<script>
try {
  const runUserCode = new Function(${jsonSafe(script)});
  runUserCode();
} catch (error) { console.error(error instanceof Error ? error.message : String(error)); }
<\/script></body></html>`;
}

/** Recursos pedagógicos originais: revisão espaçada e desafios de produto. */
const REVIEW_INTERVALS = [1, 3, 7, 14, 30];

function addDaysLocal(dateString, days) {
  const [year, month, day] = String(dateString).split('-').map(Number);
  if (![year,month,day].every(Number.isInteger)) throw new Error('Data inválida');
  const date = new Date(year, month - 1, day + days, 12);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function enrollReview(reviews, id, today) {
  if (reviews[id]) return reviews;
  return { ...reviews, [id]: {due: addDaysLocal(today, 1), level: 0, attempts: 0} };
}

function rateReview(reviews, id, rating, today) {
  const current = reviews[id];
  if (!current || !['again','good','easy'].includes(rating)) return reviews;
  const nextLevel = rating === 'again' ? 0 : Math.min(REVIEW_INTERVALS.length - 1, current.level + (rating === 'easy' ? 2 : 1));
  const days = rating === 'again' ? 1 : REVIEW_INTERVALS[nextLevel];
  return {...reviews, [id]: {due: addDaysLocal(today,days),level:nextLevel,attempts:(current.attempts||0)+1,last:today}};
}

function reviewQueue(reviews, lessons, today, includeFuture=false) {
  const ids = new Map(lessons.map(l => [l.id,l]));
  return Object.entries(reviews)
    .filter(([id,r])=> ids.has(id) && r && typeof r.due==='string' && (includeFuture || r.due<=today))
    .map(([id,r])=>({...r,id,lesson:ids.get(id)}))
    .sort((a,b)=>a.due.localeCompare(b.due) || a.lesson.lessonIndex-b.lesson.lessonIndex);
}

/** Executa código desconhecido somente em um Worker dentro de um iframe de origem opaca.
 * Não usa eval na origem do DevLab. Cada tentativa tem timeout e termina o Worker.
 */
function runWorker() {
  self.onmessage = async ({data}) => {
    const {code, functionName, cases} = data;
    const printable = value => {
      if (value === undefined) return 'undefined';
      try { return JSON.stringify(value); } catch { return String(value); }
    };
    const equal = (a,b) => {
      if (typeof a === 'number' && typeof b === 'number') return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a-b)<1e-9;
      if (Object.is(a,b)) return true;
      if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return false;
      if (Array.isArray(a)!==Array.isArray(b)) return false;
      const keysA=Object.keys(a),keysB=Object.keys(b);
      return keysA.length===keysB.length && keysA.every(k=>Object.hasOwn(b,k)&&equal(a[k],b[k]));
    };
    try {
      const getFunction = new Function('"use strict";\n' + code + '\nreturn typeof ' + functionName + ' !== "undefined" ? ' + functionName + ' : undefined;');
      const tested = getFunction();
      if (typeof tested !== 'function') throw new Error('A função ' + functionName + ' não foi encontrada. Confira o nome e a assinatura.');
      const results = [];
      for (const item of cases) {
        let actual;
        try {
          const args = structuredClone(item.args);
          const before = structuredClone(args);
          const returned = tested(...args);
          if (item.requiresPromise && (!returned || typeof returned.then !== 'function')) throw new Error('A função deve retornar uma Promise.');
          if (!item.requiresPromise && returned && typeof returned.then === 'function') throw new Error('Este exercício exige uma função síncrona.');
          actual = await returned;
          const unchanged = !item.unchangedArgs || equal(args,before);
          results.push({label:item.label,ok:equal(actual,item.expected)&&unchanged,expected:printable(item.expected),actual:printable(actual),mutation:!unchanged});
        } catch(error) { results.push({label:item.label,ok:false,expected:printable(item.expected),actual:'Erro: ' + String(error.message || error).slice(0,200)}); }
      }
      self.postMessage({kind:'results',results});
    } catch(error) { self.postMessage({kind:'error',message:String(error.message||error).slice(0,300)}); }
  };
}

function sandboxRunner() {
  const send = (token, payload) => parent.postMessage({__devlab_mission:true,token,...payload}, '*');
  let activeWorker = null;
  window.addEventListener('message', event => {
    const data = event.data;
    if (event.source !== parent || !data || data.__devlab_mission !== true || data.command !== 'run') return;
    const token = data.token;
    try {
      if (activeWorker) activeWorker.terminate();
      const source = '(' + runWorker.toString() + ')();';
      const blobUrl = URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
      activeWorker = new Worker(blobUrl);
      URL.revokeObjectURL(blobUrl);
      activeWorker.onmessage = workerEvent => send(token,workerEvent.data);
      activeWorker.onerror = () => send(token,{kind:'error',message:'Falha ao executar o Worker isolado.'});
      activeWorker.postMessage({code:data.code,functionName:data.functionName,cases:data.cases});
    } catch(error) { send(token,{kind:'error',message:'O navegador não permitiu iniciar o ambiente isolado: '+String(error.message||error)}); }
  });
  parent.postMessage({__devlab_mission:true,kind:'ready'}, '*');
}

function runMissionInSandbox(mission, source, timeoutMs=4500) {
  if (!mission || typeof source !== 'string') return Promise.resolve({kind:'error',message:'Missão inválida.'});
  if (!source.trim()) return Promise.resolve({kind:'error',message:'Escreva a função antes de executar os testes.'});
  if (source.length > 16000) return Promise.resolve({kind:'error',message:'O código ultrapassou o limite deste exercício (16 mil caracteres).'});
  return new Promise(resolve => {
    const iframe = document.createElement('iframe');
    iframe.setAttribute('sandbox','allow-scripts');
    iframe.setAttribute('aria-hidden','true');
    iframe.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;';
    const token = Math.random().toString(36).slice(2) + Date.now();
    let finished = false;
    const finish = result => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      window.removeEventListener('message',onMessage);
      iframe.remove();
      resolve(result);
    };
    const onMessage = event => {
      if (event.source !== iframe.contentWindow || event.data?.__devlab_mission !== true) return;
      if (event.data.kind === 'ready') {
        iframe.contentWindow.postMessage({__devlab_mission:true,command:'run',token,code:source,functionName:mission.functionName,cases:mission.tests},'*');
      } else if (event.data.token === token && ['results','error'].includes(event.data.kind)) {
        finish(event.data);
      }
    };
    const timer = setTimeout(()=>finish({kind:'error',message:'Tempo limite excedido. Procure loops infinitos ou cálculos que não terminam.'}),timeoutMs);
    window.addEventListener('message',onMessage);
    // A origem do iframe é opaca. O código do aluno roda dentro de um Worker desse iframe.
    iframe.srcdoc = '<!doctype html><html lang="pt-BR"><body><script>(' + sandboxRunner.toString().replace('runWorker.toString()', '('+runWorker.toString()+').toString()') + ')();<' + '/script></body></html>';
    document.body.appendChild(iframe);
  });
}

/** DevLab workspace: regras puras de projeto, módulos e exportação (sem DOM do host). */
const WORKSPACE_MAX_FILES = 32;
const WORKSPACE_MAX_FILE_BYTES = 100_000;
const WORKSPACE_MAX_TOTAL_BYTES = 480_000;
const WORKSPACE_EXTENSIONS = ['html', 'css', 'js', 'mjs', 'json'];

const makeId = () => 'ws-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
const utf8Bytes = value => new TextEncoder().encode(String(value)).length;

function workspacePath(input, base = '') {
  if (typeof input !== 'string' || !input.trim() || input.includes('\\') || input.includes('\0') || input.startsWith('/') || /^[a-z]+:/i.test(input)) throw new Error('Use um caminho relativo, como src/util.js.');
  const parts = (base ? base.split('/').filter(Boolean) : []).concat(input.split('/'));
  const output = [];
  for (const part of parts) {
    if (part === '.' || part === '') continue;
    if (part === '..') { if (!output.length) throw new Error('O arquivo não pode sair da pasta do projeto.'); output.pop(); continue; }
    if (!/^[a-zA-Z0-9_\- .]+$/.test(part) || part.length > 90 || part.trim() !== part || part.startsWith('.')) throw new Error('Nome inválido. Use letras, números, espaços, _ e -.');
    output.push(part);
  }
  if (!output.length || output.join('/').length > 180) throw new Error('Caminho vazio ou muito longo.');
  return output.join('/');
}
function validateWorkspace(project) {
  if (!project || typeof project !== 'object' || !project.files || typeof project.files !== 'object' || Array.isArray(project.files)) throw new Error('Projeto inválido.');
  const files = Object.entries(project.files);
  if (!files.length || files.length > WORKSPACE_MAX_FILES) throw new Error(`Use entre 1 e ${WORKSPACE_MAX_FILES} arquivos.`);
  let total = 0;
  for (const [path, source] of files) {
    if (workspacePath(path) !== path) throw new Error('Caminho de arquivo inválido: ' + path);
    const ext = path.split('.').pop().toLowerCase();
    if (!WORKSPACE_EXTENSIONS.includes(ext)) throw new Error('Extensão não suportada: ' + path);
    if (typeof source !== 'string' || utf8Bytes(source) > WORKSPACE_MAX_FILE_BYTES) throw new Error('Arquivo muito grande: ' + path);
    total += utf8Bytes(source);
  }
  if (total > WORKSPACE_MAX_TOTAL_BYTES) throw new Error('Projeto acima do limite de 480 KB.');
  if (!Object.hasOwn(project.files, 'index.html')) throw new Error('O projeto precisa de index.html na raiz.');
  if (!project.entry || !Object.hasOwn(project.files, project.entry) || !/\.(js|mjs)$/.test(project.entry)) throw new Error('Selecione um módulo JavaScript inicial válido.');
  return true;
}

function workspaceAdd(project, path, source = '') {
  const normalized = workspacePath(path);
  if (normalized !== path) throw new Error('Use o caminho normalizado, sem ./ ou barras duplicadas.');
  if (Object.hasOwn(project.files, normalized)) throw new Error('Este arquivo já existe.');
  const updated={...project,files:{...project.files,[normalized]:source}};
  validateWorkspace(updated);
  updated.folders=[...new Set([...(project.folders||[]), ...folderAncestors(normalized)])];
  return updated;
}
function folderAncestors(path) {const arr=path.split('/').slice(0,-1);return arr.map((_,i)=>arr.slice(0,i+1).join('/'));}
function workspaceRename(project, oldPath, newPath) {
  if (oldPath === 'index.html' || oldPath === project.entry) throw new Error('Não renomeie index.html ou o módulo inicial.');
  const path=workspacePath(newPath);
  if (path!==newPath || !Object.hasOwn(project.files,oldPath) || Object.hasOwn(project.files,path)) throw new Error('Caminho inválido ou já utilizado.');
  const files={...project.files,[path]:project.files[oldPath]};delete files[oldPath];
  const updated={...project,files,selected:project.selected===oldPath?path:project.selected,folders:[...new Set([...(project.folders||[]),...folderAncestors(path)])]};
  validateWorkspace(updated);return updated;
}
function workspaceDelete(project,path) {
  if (path==='index.html'||path===project.entry) throw new Error('Não exclua index.html nem o módulo inicial.');
  if(!Object.hasOwn(project.files,path))throw new Error('Arquivo não encontrado.');
  const files={...project.files};delete files[path];
  const updated={...project,files,selected:project.selected===path?project.entry:project.selected};validateWorkspace(updated);return updated;
}
function workspaceAddFolder(project,path){const p=workspacePath(path);if(p!==path)throw new Error('Nome da pasta inválido.');if((project.folders||[]).includes(p))throw new Error('Esta pasta já existe.');return {...project,folders:[...new Set([...(project.folders||[]),p,...folderAncestors(p)])]};}
function resolveImport(spec,from,files) {
  if (!spec.startsWith('./')&&!spec.startsWith('../')) throw new Error(`Importação externa não suportada: ${spec}. Utilize caminhos relativos.`);
  const fromDir=from.includes('/')?from.slice(0,from.lastIndexOf('/')):'';
  const canonical=workspacePath(spec,fromDir);
  const found=[canonical,canonical+'.js',canonical+'.mjs',canonical+'/index.js'].find(p=>Object.hasOwn(files,p));
  if(!found || !/\.(m?js)$/.test(found)) throw new Error(`Módulo não encontrado: ${spec} (em ${from})`);
  return found;
}
function workspaceRewriteImports(source,from,files) {
  // Subconjunto explícito de ES modules: import/export estáticos e import('arquivo') literal.
  // Não tenta analisar JavaScript arbitrário nem transformar imports calculados.
  const pattern=/(\b(?:import|export)\s*(?:[\s\S]{0,260}?\s+from\s*)?|\bimport\s*\(\s*)(['"])(\.\.?\/[^'"\n]+)\2(\s*\)?)/g;
  let rewritten=String(source).replace(pattern,(whole,prefix,quote,spec,suffix)=>{
    const resolved=resolveImport(spec,from,files);
    return prefix+quote+'@devlab/'+resolved+quote+suffix;
  });
  // Importações com origem remota ou bare specifier não são instaladas automaticamente.
  const external=/(?:\bimport\s*(?:[\s\S]{0,160}?\s+from\s*)?|\bexport\s+[^\n]{0,160}?\s+from\s*)(['"])(?!@devlab\/)([^.'"\/][^'"]*|https?:[^'"]*)\1/g;
  let m;while((m=external.exec(rewritten)))throw new Error('Importação não suportada em '+from+': '+m[2]);
  return rewritten;
}
const jsLiteral = x => JSON.stringify(x).replace(/</g,'\\u003c').replace(/[\u2028\u2029]/g,' ');
function buildWorkspacePreview(project,token,storage={}) {

    if(href?.startsWith('./')||href?.startsWith('../')){links.push(href);return '';}

  const css=cssPaths.map(x=>files[x]).join('\n');
  const rewritten={};
  for(const [path,source] of Object.entries(files))if(/\.(m?js)$/.test(path))rewritten[path]=workspaceRewriteImports(source,path,files);
  const appScript=`(() => {
  const token=${jsLiteral(token)};

  const send=(kind,payload)=>parent.postMessage({__devlab_workspace:true,token,kind,payload},'*');

  }

    get length(){return Object.keys(memory).length},
    key:i=>Object.keys(memory)[i]??null,
    getItem:k=>Object.hasOwn(memory,String(k))?memory[String(k)]:null,
    setItem:(k,v)=>{memory[String(k)]=String(v);send('storage',memory)},
    removeItem:k=>{delete memory[String(k)];send('storage',memory)},
    clear:()=>{for(const key of Object.keys(memory))delete memory[key];send('storage',memory)}

  try{Object.defineProperty(window,'localStorage',{configurable:true,value:store});}catch(err){console.warn('Storage virtual indisponível')}
  const sources=${jsLiteral(rewritten)};
  const map={imports:{}};
  for(const [path,code] of Object.entries(sources)){
    map.imports['@devlab/'+path]=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  }
  const importMap=document.createElement('script');importMap.type='importmap';importMap.textContent=JSON.stringify(map);document.head.appendChild(importMap);

function activeTab(l){const valid=['html','css',isTs(l)?'ts':'js'];return valid.includes(st.tab)?st.tab:valid[2];}
function syntax(code){
  const src=String(code||'');const pattern=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|`(?:\\[\s\S]|[^`])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:const|let|var|function|return|if|else|for|while|switch|case|break|async|await|try|catch|throw|new|class|interface|type|export|import|true|false|null|undefined|number|string|boolean|void|unknown)\b|\b\d+(?:\.\d+)?\b)/g;
  let out='',last=0,match;
  while((match=pattern.exec(src))){out+=esc(src.slice(last,match.index));const s=match[0];let cls=s.startsWith('//')||s.startsWith('/*')?'syntax-comment':s[0]==='"'||s[0]==="'"||s[0]==='`'?'syntax-string':/^\d/.test(s)?'syntax-number':'syntax-keyword';out+=`<span class="${cls}">${esc(s)}</span>`;last=pattern.lastIndex;}
  return out+esc(src.slice(last))+'\n';
}

let compilerPromise;
function ensureTypeScript(){
 if(window.ts?.transpileModule)return Promise.resolve(window.ts);
 if(compilerPromise)return compilerPromise;
 compilerPromise=new Promise((resolve,reject)=>{
   const sources=['./vendor/typescript.js','https://cdn.jsdelivr.net/npm/typescript@5.9.3/lib/typescript.js'];
   const loadSource=(index)=>{
     if(window.ts?.transpileModule){resolve(window.ts);return;}
     if(index>=sources.length){reject(new Error('Compilador TypeScript indisponível. Verifique a conexão ou use o ZIP offline.'));return;}
     const script=document.createElement('script');
     script.src=sources[index];script.async=true;
     script.onload=()=>window.ts?.transpileModule?resolve(window.ts):loadSource(index+1);
     script.onerror=()=>loadSource(index+1);
     document.head.appendChild(script);
   };
   loadSource(0);
 }).catch(error=>{compilerPromise=null;throw error;});
 return compilerPromise;
}

async function checkLessonContract(l,draft,inspection){

   let source=isTs(l)?draft.ts||'':draft.js||'';

     const ts=await ensureTypeScript();
     const typed=inspectTypeScriptContract(ts,source,contract);
     inspection.checks.push(...typed);
     if(!typed.every(c=>c.ok)) result=fail('Corrija a assinatura e os tipos indicados.');
     else {
       const out=ts.transpileModule(source,{fileName:'solution.ts',reportDiagnostics:true,compilerOptions:{target:ts.ScriptTarget.ES2020,module:ts.ModuleKind.None,strict:true}});
       const errors=(out.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
       if(errors.length)result=fail(ts.flattenDiagnosticMessageText(errors[0].messageText,' '));

     }
   }
   if(!result)result=await runMissionInSandbox(contract,source,5000);
 } catch(error) {result=fail(error?.message||String(error));}

 finishCheck(l.id,inspection);
}

function frontendCreateStarter(lessonId){

 try{
   if(track.id==='typescript'||track.id==='react'){
     const files=frontendStarterFiles(track,lesson),blob=archiveTextFiles(files);
     const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='devlab-'+track.id+'-'+lesson.id+'.zip';link.click();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('Projeto inicial exportado. Siga o README no VS Code.');
   }else{
     const starter=frontendWorkspaceStarter(track,lesson);
     let project;
     const old=fst.projects[lesson.id];
     if(old&&wst.projects[old]){wst.activeId=old;workspaceSave();nav('workspace');return;}
     project=createWorkspace('basic','Formação · '+lesson.title);
     project.files=starter.files;project.entry=starter.entry;project.selected='index.html';validateWorkspace(project);
     wst.projects[project.id]=project;wst.activeId=project.id;wst.selected='index.html';
     fst.projects[lesson.id]=project.id;save('frontend-workspace-projects',fst.projects);
     workspaceSave();nav('workspace');
   }
 }catch(error){console.error(error);toast('Não foi possível criar o projeto: '+(error?.message||error));}
}

function backendHttpLabPage(){const s=bst,methods=['GET','POST','PATCH','DELETE'],roles=[['guest','Visitante (não autenticado)'],['alice','Conta Alice (simulada)'],['bob','Conta Bob (simulada)'],['admin','Administrador (simulado)']];
 return `<section class="be-page be-http-page"><button class="back-link" data-nav="backend">← Formação backend</button><header class="be-lesson-heading"><span class="section-kicker">LABORATÓRIO DE HTTP · SIMULAÇÃO</span><h1>Inspecione uma requisição.</h1><p>Experimente códigos de status, entrada JSON e regras de autorização sem configurar um servidor. <strong>Este laboratório não faz requisições de rede nem autentica usuários reais.</strong></p></header>
 <div class="be-lab-grid"><section class="be-panel"><span class="section-kicker">REQUISIÇÃO SIMULADA</span><h2>Monte seu request</h2><div class="be-lab-fields"><label>Método<select id="be-lab-method">${methods.map(m=>`<option ${s.labMethod===m?'selected':''}>${m}</option>`).join('')}</select></label><label>Identidade simulada<select id="be-lab-role">${roles.map(([val,name])=>`<option value="${val}" ${s.labRole===val?'selected':''}>${name}</option>`).join('')}</select></label><label class="wide">Caminho da API<input id="be-lab-path" spellcheck="false" value="${esc(s.labPath)}" placeholder="/tasks/1"></label><label class="wide">Body JSON (para POST e PATCH)<textarea id="be-lab-body" rows="5" spellcheck="false">${esc(s.labBody)}</textarea></label></div><button class="ws-main-button" id="be-lab-send">Executar simulação →</button><div class="be-examples"><span>Experimente:</span>${[['GET','/health'],['GET','/tasks'],['POST','/tasks'],['PATCH','/tasks/1'],['GET','/tasks/2'],['GET','/admin/users']].map(([m,path])=>`<button data-be-example="${m}|${path}">${m} ${path}</button>`).join('')}</div></section>
 <section class="be-panel be-response"><span class="section-kicker">RESPOSTA SIMULADA</span><h2>HTTP response</h2>${s.labResult?`<div class="be-response-status"><span class="be-http-status ${s.labResult.status>=400?'be-http-error':''}">${s.labResult.status}</span><strong>${s.labResult.status===204?'No Content':s.labResult.status>=400?'Requisição rejeitada':'Requisição concluída'}</strong></div><pre class="be-response-code"><code>${esc(s.labResult.body===null?'(sem corpo)':JSON.stringify(s.labResult.body,null,2))}</code></pre>`:'<div class="be-response-placeholder">Envie uma requisição para ver o status e a resposta JSON.</div>'}<div class="be-http-notice"><strong>Experiência didática</strong><p>Mudar a identidade neste painel é uma convenção da simulação. Um backend verdadeiro deve validar sessões e permissões no servidor, nunca aceitar o perfil escolhido pelo cliente como prova de identidade.</p></div></section></div>
 ${s.labHistory.length?`<section class="be-panel"><span class="section-kicker">HISTÓRICO DESTA SESSÃO</span><div class="be-lab-history">${s.labHistory.slice(0,6).map(x=>`<div><span>${esc(x.method)} ${esc(x.path)}</span><strong>${x.status}</strong></div>`).join('')}</div></section>`:''}</section>`;
}
function backendDownloadStarter(id){const l=findBackendLesson(id),t=l&&findBackendTrack(l.track);if(!l||!t)return;try{
 const files=backendStarterFiles(t,l),blob=archiveTextFiles(files),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='devlab-backend-'+t.id+'-'+l.id+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Projeto exportado. Leia o README e execute npm test no VS Code.');
 }catch(error){console.error(error);toast('Falha ao exportar: '+(error?.message||error));}
}
window.addEventListener('click',event=>{
 const q=event.target.closest('[data-be-answer]');if(q){const l=findBackendLesson(q.dataset.beLesson);if(!l||bst.quiz[l.id])return;const choice=Number(q.dataset.beAnswer);bst.answers[l.id]=choice;if(choice===l.quiz.answer){bst.quiz[l.id]=true;save('backend-quiz',bst.quiz);recordActivity();}render();return;}
 const download=event.target.closest('[data-be-download]');if(download){backendDownloadStarter(download.dataset.beDownload);return;}
 const example=event.target.closest('[data-be-example]');if(example){const [method,path]=example.dataset.beExample.split('|');bst.labMethod=method;bst.labPath=path;render();return;}
 if(event.target.closest('#be-lab-send')){
  bst.labMethod=$('#be-lab-method')?.value||'GET';bst.labRole=$('#be-lab-role')?.value||'guest';bst.labPath=$('#be-lab-path')?.value||'/health';bst.labBody=$('#be-lab-body')?.value||'';
  try{const r=simulateBackendRequest(bst.lab,{method:bst.labMethod,path:bst.labPath,body:bst.labBody,role:bst.labRole});bst.lab=r.state;bst.labResult=r;bst.labHistory.unshift({method:bst.labMethod,path:bst.labPath,status:r.status});bst.labHistory=bst.labHistory.slice(0,10);}catch(error){bst.labResult={status:400,body:{error:error.message}};}
  render();return;
 }
});
window.addEventListener('change',event=>{
 const c=event.target.closest('[data-be-check]');if(!c)return;const l=findBackendLesson(c.dataset.beLesson),index=Number(c.dataset.beCheck);if(!l||index<0||index>=l.checks.length)return;const set=new Set(bst.checks[l.id]||[]);if(c.checked)set.add(index);else set.delete(index);bst.checks[l.id]=[...set].sort((a,b)=>a-b);save('backend-checklist',bst.checks);if(backendDone(l))recordActivity();
 const summary=$('.be-check-summary');if(summary)summary.textContent=`${set.size}/${l.checks.length} itens conferidos${backendDone(l)?' · aula revisada':''}`;
 const badge=$('.be-status');if(badge){badge.textContent=backendDone(l)?'✓ Revisão registrada':'Em estudo';badge.classList.toggle('be-status-done',backendDone(l));}
});
window.addEventListener('input',event=>{if(event.target?.id!=='be-notes')return;const route=getRoute();if(route.page!=='backend-lesson'||!findBackendLesson(route.id))return;bst.notes[route.id]=event.target.value;save('backend-notes',bst.notes);});
window.addEventListener('change',event=>{if(getRoute().page!=='backend-lab')return;for(const [id,key] of [['be-lab-method','labMethod'],['be-lab-role','labRole'],['be-lab-path','labPath'],['be-lab-body','labBody']])if(event.target?.id===id)bst[key]=event.target.value;});
window.addEventListener('input',event=>{if(getRoute().page!=='backend-lab')return;for(const [id,key] of [['be-lab-path','labPath'],['be-lab-body','labBody']])if(event.target?.id===id)bst[key]=event.target.value;});

render();
</script></body></html>
